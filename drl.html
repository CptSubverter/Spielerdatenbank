<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsche Rangliste – DRL</title><style>body{margin:0;background:#3d3d3d;font:14px Arial;color:#173042}.w{max-width:1500px;margin:auto;padding:14px}.h{background:#2fa7fa;color:#fff;padding:18px;border-radius:14px}.bar{background:#fff;padding:10px;border-radius:10px;margin-top:10px}input{padding:9px;width:320px;max-width:90%}table{width:100%;border-collapse:collapse;background:#fff;margin-top:12px}th{background:#2fa7fa;color:#fff;text-align:left;padding:8px}td{padding:7px;border-bottom:1px solid #ddd}.lnk{border:0;background:none;color:#0781c9;font-weight:bold;cursor:pointer;padding:0}.muted{color:#667}.stat{margin-top:8px}</style></head><body><div class="w"><div class="h"><h1>📈 Deutsche Rangliste (DRL)</h1><div>Archivdaten · automatisch aus den DMV-Quellen</div></div><div class="bar"><input id="q" placeholder="Spieler, Pass, Verein, LV, Stichtag …"><div id="s" class="stat">Lade DRL …</div></div><div id="o"></div></div><script>const E=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');let D=[];function pass(x){return x.pass||x.Pass||x.passnummer||x['Pass-Nr.']||x['Passnummer']||''}async function load(){try{let m=await fetch('data/drl/manifest.json?x=1').then(r=>r.json());for(let i=1;i<=m.files;i++){let a=await fetch('data/drl/drl-'+String(i).padStart(2,'0')+'.json?x=1').then(r=>r.json());D.push(...a);$('s').textContent=D.length.toLocaleString('de-DE')+' DRL-Datensätze geladen'}$('s').textContent=D.length.toLocaleString('de-DE')+' DRL-Datensätze';draw()}catch(e){$('s').textContent='DRL-Archiv wird noch aufgebaut. '+e.message}}function $(x){return document.getElementById(x)}function draw(){let q=N($('q').value),a=D.filter(x=>!q||N(Object.values(x).join(' ')).includes(q));a=a.slice(0,2000);$('o').innerHTML='<table><thead><tr><th>Stichtag</th><th>Spieler</th><th>Pass</th><th>Kategorie</th><th>Verein</th><th>LV</th><th>Rang</th><th>Wert</th><th>Spieler-Datensatz</th></tr></thead><tbody>'+a.map(x=>{let p=pass(x),n=x.Name||x.name||x['Name, Vorname']||'';return '<tr><td>'+E(x.DRL_Stichtag||x.Stichtag||x.datum||x.date||'')+'</td><td>'+E(n)+'</td><td>'+E(p)+'</td><td>'+E(x.Kat||x.Kategorie||x.class||'')+'</td><td>'+E(x.Verein||x.club||'')+'</td><td>'+E(x.LV||x.lv||'')+'</td><td>'+E(x.Platz||x.rank||'')+'</td><td>'+E(x.Wert||x.value||'')+'</td><td>'+(p?'<a class="lnk" href="player.html?pass='+encodeURIComponent(p)+'">👤 öffnen</a>':'–')+'</td></tr>'}).join('')+'</tbody></table><p class="muted">Anzeige: maximal 2.000 Treffer. Die vollständige Historie bleibt in den DRL-Dateien.</p>')}$('q').oninput=draw;load();</script></body></html>
