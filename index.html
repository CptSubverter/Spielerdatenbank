<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1687d9"><title>Bahnengolf.net – Spielerdatenbank</title>
<style>
*{box-sizing:border-box}body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;color:#173042;background:#f5f9fc}.wrap{max-width:1400px;margin:auto;padding:10px}.head{background:linear-gradient(135deg,#1687d9,#72c7fb);color:#fff;padding:18px;border-radius:14px}.head h1{margin:0 0 4px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button,.sort button{border:1px solid #cfe3ef;background:#fff;border-radius:9px;padding:9px 12px;font-weight:650;cursor:pointer}.tabs button.active,.sort button.active{background:#1687d9;color:#fff}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:9px 0}.controls input,.controls select{padding:11px;border:1px solid #cfe3ef;border-radius:9px;font-size:15px;background:#fff}.letters{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}.letters button{border:1px solid #cfe3ef;background:#fff;border-radius:6px;padding:6px 9px;cursor:pointer}.stats{margin:8px 0}.table{overflow:auto;background:#fff;border:1px solid #d8eaf5;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:760px}th{background:#1687d9;color:#fff;text-align:left;padding:8px;white-space:nowrap}td{padding:7px;border-bottom:1px solid #edf3f7}tr:hover td{background:#f7fbfe}.linkbtn{border:0;background:none;color:#087fc9;font-weight:650;cursor:pointer;padding:0;text-align:left}.profile{display:none;background:#fff;border:1px solid #d8eaf5;border-radius:10px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:7px}.card{background:#f7fbfe;border:1px solid #d8eaf5;border-radius:8px;padding:8px}.hist{max-height:620px;overflow:auto}.hint{background:#eef8ff;border:1px solid #cfeaf9;border-radius:9px;padding:9px;margin:9px 0}.roundbox{background:#fff;border:1px solid #d8eaf5;border-radius:9px;padding:8px;margin:6px 0}.roundline{display:flex;flex-wrap:wrap;gap:4px}.rchip{background:#eef8ff;border:1px solid #cfeaf9;border-radius:6px;padding:3px 6px;font-size:12px}.small,.muted{font-size:12px;color:#5d7380}.ok{font-weight:700}.bad{font-weight:700}.sort{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}@media(max-width:700px){.wrap{padding:6px}.head{padding:13px}.tabs{flex-wrap:nowrap;overflow-x:auto}.tabs button{flex:0 0 auto;font-size:12px}.controls{grid-template-columns:1fr}.profile{padding:10px}table{font-size:12px}}
</style></head><body><div class="wrap">
<div class="head"><h1>🏆 Bahnengolf.net</h1><div>Spieler · Ergebnisse · Runden · Vereine · Verbände · Turniere</div><small id="stand">Daten werden geladen …</small></div>
<div class="tabs" id="tabs">
<button data-mode="players" class="active">👤 Spieler</button><button data-mode="results">📊 Ergebnisse</button><button data-mode="rounds">🎯 Runden</button><button data-mode="clubs">🏟️ Vereine</button><button data-mode="lvs">🌐 Verbände</button><button data-mode="tournaments">🏆 Turniere</button><button data-mode="quality">🔍 Datenprüfung</button>
</div><div class="hint" id="hint"></div><div class="controls"><input id="q" placeholder="🔎 Suche …"><select id="f1"></select><select id="f2"></select></div><div class="letters" id="letters"></div>
<div class="stats"><b id="count">0</b> Treffer · <span id="total">0</span> Einträge</div><div id="profile" class="profile"></div>
<div class="table"><table><thead id="thead"></thead><tbody id="rows"><tr><td>Lade Daten …</td></tr></tbody></table></div>
</div>
<script>
const DATA='data/';
let players=[],results=[],rounds=[],clubs=[],lvs=[],tournaments=[],mode='players',selected=null,tournamentByCode=new Map();
const files={players:['players-01.json','players-02.json','players-03.json','players-04.json','players-05.json','players-06.json','players-07.json','players-08.json'],results:['results-01.json','results-02.json','results-03.json','results-04.json','results-05.json','results-06.json','results-07.json','results-08.json'],rounds:['rounds-01.json','rounds-02.json','rounds-03.json','rounds-04.json']};
const $=id=>document.getElementById(id), norm=s=>(s??'').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9äöüß]+/g,' ').trim();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function buildTournamentCatalog(raw){const key=s=>String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();const resultCount=new Map(),roundCount=new Map();results.forEach(r=>{const c=String(r.tournament_id||r.tournament_code||'');resultCount.set(c,(resultCount.get(c)||0)+1);if(r.rounds_available)roundCount.set(c,(roundCount.get(c)||0)+1)});const groups=new Map();raw.forEach(t=>{const code=t.tournament_id||t.code||'';const name=key(t.name);const k=name?(String(t.year||'')+'|'+key(t.date)+'|'+name+'|'+key(t.location)):('single|'+code);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});return [...groups.values()].map(v=>{const codes=v.map(t=>t.tournament_id||t.code).filter(Boolean);const names=v.map(t=>t.name).filter(Boolean);const locs=v.map(t=>t.location).filter(Boolean);return {tournament_id:codes[0],code:codes[0],year:v[0].year,date:v[0].date,name:names[0]||codes[0],location:locs[0]||'',years:[v[0].year].filter(Boolean),source_codes:codes,participation_count:codes.reduce((n,c)=>n+(resultCount.get(String(c))||0),0),round_result_count:codes.reduce((n,c)=>n+(roundCount.get(String(c))||0),0),sources:[...new Set(v.flatMap(t=>t.sources||[]))]}})}
async function loadSet(list){const a=await Promise.all(list.map(u=>fetch(DATA+u).then(r=>{if(!r.ok)throw Error(u+' '+r.status);return r.json()})));return a.flat();}
async function init(){
 try{
  [players,results,rounds,clubs,lvs,tournaments]=await Promise.all([
   loadSet(files.players),loadSet(files.results),loadSet(files.rounds),
   fetch(DATA+'clubs.json').then(r=>r.json()),fetch(DATA+'associations.json').then(r=>r.json()),fetch(DATA+'tournaments.json').then(r=>r.json())
  ]);
  tournaments=buildTournamentCatalog(tournaments);
  tournaments.forEach(t=>(t.source_codes||[t.code||t.tournament_id]).forEach(c=>tournamentByCode.set(String(c),t)));
  results.forEach(r=>{let t=tournamentByCode.get(String(r.tournament_id||r.tournament_code));if(t){if(!r.tournament)r.tournament=t.name;if(!r.location)r.location=t.location}});
  $('stand').textContent=`7.564 Spieler · ${results.length.toLocaleString('de-DE')} Ergebnisse/Teilnahmen · ${rounds.length.toLocaleString('de-DE')} Rundensätze · 2015–2025`;
  $('hint').textContent='Wichtig: Teilnahmen ohne Einzelrunden bleiben vollständig erhalten. Einzelrunden werden getrennt angezeigt; 2020, 2021 und 2026 sind in dieser Ergebnisebene ausgeschlossen.';
  render();
 }catch(e){$('stand').textContent='Fehler beim Laden: '+e.message;$('rows').innerHTML='<tr><td>Die Daten konnten nicht vollständig geladen werden.</td></tr>';console.error(e)}
}
$('tabs').onclick=e=>{const b=e.target.closest('button[data-mode]');if(!b)return;mode=b.dataset.mode;selected=null;$('profile').style.display='none';document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));$('q').value='';render()};
$('q').oninput=render;$('f1').onchange=render;$('f2').onchange=render;
function setupFilters(opts1=[],opts2=[],labels=['Filter 1','Filter 2']){$('f1').innerHTML='<option value="">'+labels[0]+'</option>'+opts1.map(x=>`<option>${esc(x)}</option>`).join('');$('f2').innerHTML='<option value="">'+labels[1]+'</option>'+opts2.map(x=>`<option>${esc(x)}</option>`).join('')}
function render(){if(!players.length)return;$('profile').style.display='none';$('letters').innerHTML='';if(mode==='players')renderPlayers();else if(mode==='results')renderResults();else if(mode==='rounds')renderRounds();else if(mode==='clubs')renderClubs();else if(mode==='lvs')renderLVs();else if(mode==='tournaments')renderTournaments();else renderQuality()}
function renderLetters(arr,field='name'){const letters=[...new Set(arr.map(x=>(x[field]||'').charAt(0).toUpperCase()).filter(Boolean))].sort();$('letters').innerHTML=letters.map(l=>`<button onclick="letter('${l}')">${l}</button>`).join('')}
let letterFilter='';window.letter=l=>{letterFilter=l;render()};function match(text){return !$('q').value||norm(text).includes(norm($('q').value))}
function renderPlayers(){setupFilters([...new Set(players.map(p=>p.club).filter(Boolean))].sort(),[...new Set(players.map(p=>p.lv).filter(Boolean))].sort(),['Verein','Verband']);renderLetters(players);let a=players.filter(p=>(!letterFilter||p.name?.toUpperCase().startsWith(letterFilter))&&match([p.name,p.pass,p.club,p.lv].join(' '))&&(!$('f1').value||p.club===$('f1').value)&&(!$('f2').value||p.lv===$('f2').value));$('thead').innerHTML='<tr><th>Spieler</th><th>Pass</th><th>Klasse</th><th>Verein</th><th>LV</th><th>DRL Rang</th><th>DRL Wert</th><th>Teilnahmen</th></tr>';$('rows').innerHTML=a.slice(0,500).map((p,i)=>`<tr><td><button class="linkbtn" onclick="showPlayer(${players.indexOf(p)})">${esc(p.name)}</button></td><td>${esc(p.pass||'')}</td><td>${esc(p.class)}</td><td>${esc(p.club)}</td><td>${esc(p.lv)}</td><td>${p.rank??''}</td><td>${p.value??''}</td><td>${playerResults(p).length}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=players.length.toLocaleString('de-DE')}
function playerResults(p){let key=p.pass?String(p.pass):'';let n=norm(p.name);return results.filter(r=>(key&&String(r.master_pass||r.pass)===key)||(!key&&norm(r.master_name||r.name)===n))}
function historyResults(p){let a=p.tournaments||[];return a.map(x=>({code:x.code||'',date:x.date||'',value:x.value,source:'DRL/Spielerhistorie'})).filter(x=>x.code||x.date)}
window.showPlayer=i=>{const p=players[i];selected=p;const rs=playerResults(p).sort((a,b)=>(a.year||0)-(b.year||0)||String(a.date||'').localeCompare(String(b.date||'')));const hs=historyResults(p);let html=`<h2>${esc(p.name)}</h2><div class="grid"><div class="card"><b>Pass</b><br>${esc(p.pass||'offen')}</div><div class="card"><b>Verein</b><br>${esc(p.club)}</div><div class="card"><b>LV</b><br>${esc(p.lv)}</div><div class="card"><b>Klasse</b><br>${esc(p.class)}</div><div class="card"><b>Ergebnisarchiv</b><br>${rs.length}</div><div class="card"><b>Historische Teilnahmen</b><br>${hs.length}</div><div class="card"><b>Mit Runden</b><br>${rs.filter(r=>r.rounds_available).length}</div></div>`;
html+=`<div class="sort"><button onclick="closeProfile()">✕ Profil schließen</button></div><h3>🏆 Ergebnisse / Turnierteilnahmen</h3><div class="hist">${rs.map(r=>`<div class="roundbox"><b>${esc(r.tournament||r.tournament_code||'Turnier unbekannt')}</b> · ${r.year??''} · ${esc(r.location||'')}</br><span class="small">${esc(r.date||'')} · Platz ${r.place??'–'} · ${esc(r.club||'')}</span><br>${r.rounds_available?`<span class="small">Runden: ${r.rounds.map((v,j)=>`R${j+1} ${v}`).join(' · ')} · Gesamt ${r.total??'–'} · Schnitt ${r.average==null?'–':Number(r.average).toFixed(2)}</span>`:'<span class="muted">Keine Einzelrunden vorhanden – Teilnahme bleibt erhalten.</span>'}</div>`).join('')||'<div class="hint">Keine Ergebnisdatensätze gefunden.</div>'}</div>`;
html+=`<h3>📚 Weitere historische Turnierteilnahmen</h3><div class="hist">${hs.map(h=>{let t=tournamentByCode.get(String(h.code));return `<div class="roundbox"><b>${esc(t?.name||h.code||'Turnier')}</b><br><span class="small">${esc(h.date||t?.date||'')} · ${t?.location?esc(t.location)+' · ':''}Wert ${h.value??'–'}${t?'':' · historische Spielerhistorie'}</span></div>`}).join('')||'<div class="hint">Keine zusätzlichen historischen Teilnahmen.</div>'}</div>`;
$('profile').innerHTML=html;$('profile').style.display='block';window.scrollTo({top:0,behavior:'smooth'})};window.closeProfile=()=>{$('profile').style.display='none'};
function renderResults(){setupFilters([...new Set(results.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a),[...new Set(results.map(r=>r.club).filter(Boolean))].sort(),['Jahr','Verein']);let a=results.filter(r=>(!$('f1').value||String(r.year)===$('f1').value)&&(!$('f2').value||r.club===$('f2').value)&&match([r.name,r.master_name,r.tournament,r.location,r.club,r.pass].join(' ')));$('thead').innerHTML='<tr><th>Spieler</th><th>Jahr</th><th>Turnier</th><th>Ort</th><th>Platz</th><th>Verein</th><th>Runden</th><th>Gesamt</th><th>Schnitt</th></tr>';$('rows').innerHTML=a.slice(0,500).map(r=>`<tr><td>${esc(r.master_name||r.name)}</td><td>${r.year||''}</td><td>${esc(r.tournament||r.tournament_code||r.tournament_id||'Turnier unbekannt')}</td><td>${esc(r.location)}</td><td>${r.place??''}</td><td>${esc(r.club)}</td><td>${r.rounds_available?'Ja':'Nein'}</td><td>${r.total??''}</td><td>${r.average==null?'':Number(r.average).toFixed(2)}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=results.length.toLocaleString('de-DE')}
function renderRounds(){setupFilters([...new Set(rounds.map(r=>r.year).filter(Boolean))].sort((a,b)=>b-a),[],['Jahr','']);let a=rounds.filter(r=>(!$('f1').value||String(r.year)===$('f1').value)&&match([r.player_name,r.player_source_name,r.tournament,r.location,r.club,r.code].join(' ')));$('thead').innerHTML='<tr><th>Spieler</th><th>Jahr</th><th>Turnier</th><th>Ort</th><th>Runden</th><th>Gesamt</th><th>Schnitt</th><th>Identität</th></tr>';$('rows').innerHTML=a.slice(0,500).map(r=>`<tr><td>${esc(r.player_name)}</td><td>${r.year}</td><td>${esc(r.tournament||r.tournament_code||r.tournament_id||'Turnier unbekannt')}</td><td>${esc(r.location)}</td><td>${r.rounds.join(' · ')}</td><td>${r.total}</td><td>${Number(r.average).toFixed(2)}</td><td>${esc(r.match_method)}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=rounds.length.toLocaleString('de-DE')}
function renderClubs(){setupFilters([],[],['','']);let a=clubs.filter(c=>match(JSON.stringify(c)));$('thead').innerHTML='<tr><th>Verein</th><th>LV</th><th>Spieler</th></tr>';$('rows').innerHTML=a.slice(0,500).map(c=>`<tr><td>${esc(c.name||c.club||c)}</td><td>${esc(c.lv||c.association||'')}</td><td>${c.players??c.count??''}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=clubs.length.toLocaleString('de-DE')}
function renderLVs(){setupFilters([],[],['','']);let a=lvs.filter(c=>match(JSON.stringify(c)));$('thead').innerHTML='<tr><th>Verband</th><th>Vereine</th><th>Spieler</th></tr>';$('rows').innerHTML=a.slice(0,500).map(c=>`<tr><td>${esc(c.code||c.name||c.lv||c)}</td><td>${c.clubs??c.count_clubs??''}</td><td>${c.players??c.count_players??''}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=lvs.length.toLocaleString('de-DE')}
function renderTournaments(){setupFilters([...new Set(tournaments.map(t=>t.year).filter(Boolean))].sort((a,b)=>b-a),[],['Jahr','']);let a=tournaments.filter(t=>(!$('f1').value||String(t.year)===$('f1').value)&&match(JSON.stringify(t)));$('thead').innerHTML='<tr><th>Turnier</th><th>Jahr</th><th>Ort</th><th>Teilnehmer</th><th>Runden</th></tr>';$('rows').innerHTML=a.slice(0,500).map(t=>`<tr><td><button class="linkbtn" data-tournament="${esc(t.code||t.tournament_id)}">${esc(t.name||t.tournament||t.code||t)}</button><div class="small">${(t.source_codes||[]).length} Quellcodes zusammengeführt</div></td><td>${t.year??''}</td><td>${esc(t.location||t.place||'')}</td><td>${t.participation_count??t.players??t.count??''}</td><td>${t.round_result_count??0}</td></tr>`).join('');$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=tournaments.length.toLocaleString('de-DE')}
function showTournament(code){let ts=tournaments.find(t=>String(t.code||t.tournament_id)===String(code));let codes=new Set(ts?.source_codes||[code]);let rs=results.filter(r=>codes.has(String(r.tournament_id||r.tournament_code)));profile.style.display='block';profile.innerHTML=`<h2>🏆 ${esc(ts?.name||code)}</h2><div class="grid"><div class="card"><b>Jahr</b><br>${ts?.year??'–'}</div><div class="card"><b>Ort</b><br>${esc(ts?.location||'–')}</div><div class="card"><b>Teilnehmer</b><br>${rs.length}</div><div class="card"><b>Mit Runden</b><br>${rs.filter(r=>r.rounds_available).length}</div><div class="card"><b>Zusammengeführt</b><br>${codes.size} Quellcodes</div></div><div class="table"><table><thead><tr><th>Platz</th><th>Spieler</th><th>Verein</th><th>Runden</th><th>Gesamt</th><th>Ø</th></tr></thead><tbody>${rs.sort((a,b)=>(Number(a.place)||99999)-(Number(b.place)||99999)).map(r=>`<tr><td>${r.place??'–'}</td><td>${esc(r.master_name||r.name)}</td><td>${esc(r.club||'')}</td><td>${r.rounds_available?(r.rounds||[]).map((v,i)=>`R${i+1}: ${v}`).join(' · '):'–'}</td><td>${r.total??'–'}</td><td>${r.average==null?'–':Number(r.average).toFixed(2)}</td></tr>`).join('')}</tbody></table></div>`;profile.scrollIntoView({behavior:'smooth',block:'start'})}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tournament]');if(t)showTournament(t.dataset.tournament)});
function renderQuality(){setupFilters([],[],['','']);const years={};results.forEach(r=>years[r.year]=(years[r.year]||0)+1);const noRounds=results.filter(r=>!r.rounds_available).length;const conflicts=rounds.filter(r=>!Array.isArray(r.rounds)||!r.rounds.length||r.total==null||r.average==null).length;$('thead').innerHTML='<tr><th>Prüfung</th><th>Wert</th><th>Status</th></tr>';$('rows').innerHTML=`<tr><td>Spieler</td><td>${players.length}</td><td>OK</td></tr><tr><td>Teilnahmen/Ergebnisse</td><td>${results.length}</td><td>OK</td></tr><tr><td>Davon ohne Einzelrunden</td><td>${noRounds}</td><td>Erhalten</td></tr><tr><td>Einzelrunden-Sätze</td><td>${rounds.length}</td><td>${conflicts?'PRÜFEN':'OK'}</td></tr><tr><td>2020/2021/2026</td><td>nicht in Ergebnisebene</td><td>OK</td></tr>`;$('count').textContent='5';$('total').textContent='Prüfpunkte'}
init();
</script></body></html>
