<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1687d9"><title>Bahnengolf.net – Spielerdatenbank</title><style>
body{font-family:system-ui,-apple-system,Segoe UI,Arial;margin:0;color:#173042;background:#f5f9fc}.wrap{max-width:1280px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#1687d9,#72c7fb);color:#fff;padding:20px;border-radius:14px}.head h1{margin:0 0 5px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tabs button,.sort button{border:1px solid #cfe3ef;background:#fff;border-radius:9px;padding:10px 14px;font-size:15px;font-weight:650;cursor:pointer}.tabs button.active,.sort button.active{background:#1687d9;color:#fff;border-color:#1687d9}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:10px 0}.controls input,.controls select{padding:12px;border:1px solid #cfe3ef;border-radius:9px;font-size:16px;background:#fff}.letters{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}.letters button{border:1px solid #cfe3ef;background:#fff;border-radius:7px;padding:7px 10px;cursor:pointer}.stats{margin:10px 0}.table{overflow:auto;background:#fff;border:1px solid #d8eaf5;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:720px}th{background:#1687d9;color:#fff;text-align:left;padding:9px;white-space:nowrap}td{padding:8px;border-bottom:1px solid #edf3f7}tr:hover td{background:#f7fbfe}.linkbtn{border:0;background:none;color:#087fc9;font-weight:650;cursor:pointer;padding:0;text-align:left}.profile{display:none;background:#fff;border:1px solid #d8eaf5;border-radius:10px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.card,.statbox{background:#f7fbfe;border:1px solid #d8eaf5;border-radius:8px;padding:9px}.hist{overflow:auto;max-height:560px}.hint{background:#eef8ff;border:1px solid #cfeaf9;border-radius:9px;padding:10px;margin:10px 0}.sort{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.roundbox{background:#fff;border:1px solid #d8eaf5;border-radius:9px;padding:9px;margin:7px 0}.roundline{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}.rchip{background:#eef8ff;border:1px solid #cfeaf9;border-radius:6px;padding:4px 7px;font-size:13px}.small{font-size:12px;color:#496273}.muted{color:#687d8a;font-size:12px}.loading{padding:20px;text-align:center}@media(max-width:700px){.wrap{padding:6px}.head{padding:14px 12px}.tabs{flex-wrap:nowrap;overflow-x:auto}.tabs button{flex:0 0 auto;padding:9px 10px;font-size:13px}.controls{grid-template-columns:1fr}.table table{font-size:12px}.profile{padding:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><div class="wrap"><div class="head"><h1>🏆 Bahnengolf.net</h1><div>Spieler · Ergebnisse · Runden · Vereine · Verbände · Turniere</div><small id="stand">Datenbank wird geladen …</small></div><div class="tabs" id="tabs"><button data-mode="players" class="active">👤 Spieler</button><button data-mode="results">📊 Ergebnisse</button><button data-mode="rounds">🎯 Runden</button><button data-mode="clubs">🏟️ Vereine</button><button data-mode="lvs">🌐 Verbände</button><button data-mode="tournaments">🏆 Turniere</button><button data-mode="quality">🔍 Datenprüfung</button></div><div class="hint" id="hint"></div><div class="controls"><input id="q" placeholder="🔎 Suche …"><select id="f1"></select><select id="f2"></select></div><div class="letters" id="letters"></div><div class="stats"><b id="count">0</b> Treffer · <span id="total">0</span> Einträge</div><div id="profile" class="profile"></div><div class="table"><table><thead id="thead"></thead><tbody id="rows"><tr><td class="loading">Lade Daten …</td></tr></tbody></table></div></div>
<script>
let players=[],results=[],rounds=[],clubs=[],lvs=[],tournaments=[],mode='players',resultMap=new Map(),roundMap=new Map();
const $=id=>document.getElementById(id),q=$('q'),f1=$('f1'),f2=$('f2'),rows=$('rows'),thead=$('thead'),letters=$('letters'),profile=$('profile');
const norm=s=>String(s??'').toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=v=>{let n=Number(v);return Number.isFinite(n)?n.toFixed(3).replace('.',','):''};
const uniq=a=>{let m=new Map();a.forEach(v=>{let s=String(v??'').trim();if(s&&!m.has(norm(s)))m.set(norm(s),s)});return [...m.values()].sort((a,b)=>a.localeCompare(b,'de'))};
async function load(){const base='data/';const files=[...Array(8)].map((_,i)=>`players-0${i+1}.json`);const rf=[...Array(8)].map((_,i)=>`results-0${i+1}.json`);const xf=[...Array(4)].map((_,i)=>`rounds-0${i+1}.json`);const [p,r,x,c,a,t]=await Promise.all([Promise.all(files.map(f=>fetch(base+f).then(x=>x.json()))),Promise.all(rf.map(f=>fetch(base+f).then(x=>x.json()))),Promise.all(xf.map(f=>fetch(base+f).then(x=>x.json()))),fetch(base+'clubs.json').then(x=>x.json()),fetch(base+'associations.json').then(x=>x.json()),fetch(base+'tournaments.json').then(x=>x.json())]);players=p.flat();results=r.flat();rounds=x.flat();clubs=c;lvs=a;tournaments=t;results.forEach(v=>resultMap.set(v.result_id,v));rounds.forEach(v=>roundMap.set(v.round_result_id,v));$('stand').textContent=`${players.length.toLocaleString('de-DE')} Spieler · ${results.length.toLocaleString('de-DE')} Ergebnisse · ${rounds.length.toLocaleString('de-DE')} Rundensätze · Stand 2015–2025`;setMode('players')}
function renderLetters(){letters.innerHTML='';'ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('').forEach(l=>{let b=document.createElement('button');b.textContent=l;b.onclick=()=>{q.value=l;render()};letters.appendChild(b)})}
function opts(el,arr,first){el.innerHTML=`<option value="">${first}</option>`+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function setMode(m){mode=m;profile.style.display='none';q.value='';renderLetters();f1.style.display='';f2.style.display='';if(m==='players'){hint.textContent='Suche nach Name, Spielernummer, Verein oder Verband.';opts(f1,uniq(players.map(p=>p.club)),'Alle Vereine');opts(f2,uniq(players.flatMap(p=>(p.dmv_history||p.history||[]).map(h=>String(h.year||String(h.date||'').slice(0,4))))).sort().reverse(),'Alle Jahre');thead.innerHTML='<tr><th>Name</th><th>Verein</th><th>LV</th><th>Spielernummer</th><th>DRL-Platz</th><th>Wert</th></tr>'}else if(m==='results'){hint.textContent='Alle Turnierteilnahmen – auch solche ohne auslesbare Einzelrunden.';opts(f1,uniq(results.map(r=>r.year)).sort().reverse(),'Alle Jahre');opts(f2,uniq(results.map(r=>r.club)),'Alle Vereine');thead.innerHTML='<tr><th>Turnier</th><th>Jahr</th><th>Spieler</th><th>Verein</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'}else if(m==='rounds'){hint.textContent='Nur Datensätze mit tatsächlich ausgelesenen Einzelrunden.';opts(f1,uniq(rounds.map(r=>r.year)).sort().reverse(),'Alle Jahre');opts(f2,uniq(rounds.map(r=>r.tournament)),'Alle Turniere');thead.innerHTML='<tr><th>Spieler</th><th>Turnier</th><th>Jahr</th><th>Runden</th><th>Gesamt</th><th>Ø</th></tr>'}else if(m==='clubs'){hint.textContent='Vereine aus der aufgeteilten Datenbasis.';opts(f1,uniq(lvs.map(x=>x.name||x)),'Alle Verbände');f2.style.display='none';thead.innerHTML='<tr><th>Verein</th><th>Verband</th><th>Spieler</th><th>Teilnahmen</th></tr>'}else if(m==='lvs'){hint.textContent='Landesverbände mit Vereinen und Spielern.';f1.style.display='none';f2.style.display='none';thead.innerHTML='<tr><th>Verband</th><th>Vereine</th><th>Spieler</th></tr>'}else if(m==='tournaments'){hint.textContent='Turniere mit Teilnehmerzahl und Rundenergebnissen.';opts(f1,uniq(tournaments.flatMap(t=>t.years||[])).sort().reverse(),'Alle Jahre');f2.style.display='none';thead.innerHTML='<tr><th>Turnier</th><th>Ort</th><th>Jahr</th><th>Teilnehmer</th><th>Runden</th></tr>'}else{f1.style.display='none';f2.style.display='none';hint.textContent='Technische Schnellprüfung der aufgeteilten Datenbasis.';thead.innerHTML='<tr><th>Prüfung</th><th>Wert</th></tr>'}render()}
function render(){let term=norm(q.value);let a=[];if(mode==='players'){a=players.filter(p=>(!term||norm(`${p.name} ${p.pass} ${p.club} ${p.lv}`).includes(term))&&(!f1.value||norm(p.club)===norm(f1.value))&&(!f2.value||(p.dmv_history||p.history||[]).some(h=>String(h.year||String(h.date||'').slice(0,4))===f2.value)));$('count').textContent=a.length;$('total').textContent=players.length;rows.innerHTML=a.slice(0,1000).map(p=>`<tr><td><button class="linkbtn" data-player="${players.indexOf(p)}">${esc(p.name)}</button></td><td>${esc(p.club)}</td><td>${esc(p.lv)}</td><td>${esc(p.pass)||'–'}</td><td>${p.rank??'–'}</td><td>${fmt(p.value)||'–'}</td></tr>`).join('')}else if(mode==='results'){a=results.filter(r=>(!term||norm(`${r.name} ${r.tournament} ${r.club} ${r.tournament_code}`).includes(term))&&(!f1.value||String(r.year)===f1.value)&&(!f2.value||norm(r.club)===norm(f2.value)));$('count').textContent=a.length;$('total').textContent=results.length;rows.innerHTML=a.slice(0,1500).map(r=>`<tr><td><button class="linkbtn" data-tournament="${esc(r.tournament_code)}">${esc(r.tournament)}</button><div class="small">${esc(r.tournament_code)}</div></td><td>${r.year}</td><td><button class="linkbtn" data-result-player="${esc(r.player_key)}">${esc(r.name)}</button></td><td>${esc(r.club)}</td><td>${r.place??'–'}</td><td>${r.rounds_available?'✓':'–'}</td><td>${r.total??'–'}</td></tr>`).join('')}else if(mode==='rounds'){a=rounds.filter(r=>(!term||norm(`${r.name} ${r.tournament} ${r.tournament_code}`).includes(term))&&(!f1.value||String(r.year)===f1.value)&&(!f2.value||norm(r.tournament)===norm(f2.value)));$('count').textContent=a.length;$('total').textContent=rounds.length;rows.innerHTML=a.slice(0,1500).map(r=>`<tr><td><button class="linkbtn" data-round-player="${esc(r.player_key)}">${esc(r.name)}</button></td><td>${esc(r.tournament)}</td><td>${r.year}</td><td>${r.rounds.map((v,i)=>`R${i+1}: ${v}`).join(' · ')}</td><td>${r.total}</td><td>${fmt(r.average)}</td></tr>`).join('')}else if(mode==='clubs'){a=clubs.filter(c=>(!term||norm(`${c.name} ${c.normalized}`).includes(term))&&(!f1.value||((c.associations||[]).map(norm).includes(norm(f1.value)))));$('count').textContent=a.length;$('total').textContent=clubs.length;rows.innerHTML=a.map(c=>`<tr><td><button class="linkbtn" data-club="${esc(c.name)}">${esc(c.name)}</button></td><td>${esc((c.associations||[]).join(', '))}</td><td>${c.player_count}</td><td>${c.participation_count}</td></tr>`).join('')}else if(mode==='lvs'){a=lvs.filter(x=>!term||norm(x.name||x).includes(term));$('count').textContent=a.length;$('total').textContent=lvs.length;rows.innerHTML=a.map(x=>`<tr><td><button class="linkbtn" data-lv="${esc(x.name||x)}">${esc(x.name||x)}</button></td><td>${x.club_count}</td><td>${x.player_count}</td></tr>`).join('')}else if(mode==='tournaments'){a=tournaments.filter(t=>(!term||norm(`${t.name} ${t.code} ${t.location}`).includes(term))&&(!f1.value||(t.years||[]).map(String).includes(f1.value)));$('count').textContent=a.length;$('total').textContent=tournaments.length;rows.innerHTML=a.slice(0,1500).map(t=>`<tr><td><button class="linkbtn" data-tournament="${esc(t.code||t.tournament_id)}">${esc(t.name)}</button><div class="small">${esc(t.code||t.tournament_id)}</div></td><td>${esc(t.location)}</td><td>${esc((t.years||[]).join(', '))}</td><td>${t.participation_count}</td><td>${t.round_result_count}</td></tr>`).join('')}else{let checks=[['Spieler',players.length],['Turnierteilnahmen',results.length],['Rundensätze',rounds.length],['Vereine',clubs.length],['Verbände',lvs.length],['Turniere',tournaments.length],['Doppelte Spielernummern',duplicatePasses()],['Ergebnisse ohne Runden',results.filter(r=>!r.rounds_available).length],['2020/2021',results.filter(r=>r.year===2020||r.year===2021).length],['2026',results.filter(r=>r.year===2026).length]];$('count').textContent=checks.length;$('total').textContent=checks.length;rows.innerHTML=checks.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1].toLocaleString('de-DE')}</td></tr>`).join('')}}
function duplicatePasses(){let s=new Set(),d=0;players.forEach(p=>{let x=String(p.pass||'').trim();if(x){if(s.has(x))d++;s.add(x)}});return d}
function showPlayer(i){let p=players[i];let key=String(p.pass||'')||`idx:${i}`;let rs=results.filter(r=>String(r.player_key)===key||(p.pass&&String(r.pass)===String(p.pass)));let rr=rounds.filter(r=>String(r.player_key)===key||(p.pass&&String(r.pass)===String(p.pass)));if(!rs.length){rs=results.filter(r=>norm(r.name)===norm(p.name))}if(!rr.length){rr=rounds.filter(r=>norm(r.name)===norm(p.name))}let hist=(p.dmv_history||p.history||[]);profile.style.display='block';profile.innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="grid"><div class="card"><b>Spielernummer</b><br>${esc(p.pass)||'–'}</div><div class="card"><b>Verein</b><br>${esc(p.club)||'–'}</div><div class="card"><b>Verband</b><br>${esc(p.lv)||'–'}</div><div class="card"><b>Kategorie</b><br>${esc(p.class)||'–'}</div><div class="card"><b>DRL-Platz</b><br>${p.rank??'–'}</div><div class="card"><b>DRL-Wert</b><br>${fmt(p.value)||'–'}</div><div class="card"><b>Turnierteilnahmen</b><br>${rs.length}</div><div class="card"><b>Rundensätze</b><br>${rr.length}</div></div><h3>🏆 Alle Turnierteilnahmen</h3><div class="hist">${rs.map(r=>`<div class="roundbox"><button class="linkbtn" data-tournament="${esc(r.tournament_code)}">${esc(r.tournament)}</button><br><span class="small">${esc(r.date)} · ${esc(r.location)} · ${esc(r.club)} · Platz ${r.place??'–'}</span><br>${r.rounds_available?`Runden vorhanden · Gesamt ${r.total??'–'} · Ø ${fmt(r.average)||'–'}`:'<span class="muted">Keine Einzelrunden im Ergebnisarchiv – Teilnahme bleibt erhalten.</span>'}</div>`).join('')||'Keine Teilnahme gefunden.'}</div><h3>🎯 Einzelrunden</h3><div class="hist">${rr.map(r=>`<div class="roundbox"><b>${esc(r.tournament)}</b><br><span class="small">${esc(r.date)} · ${esc(r.location)}</span><div class="roundline">${r.rounds.map((v,i)=>`<span class="rchip"><b>R${i+1}</b> ${v}</span>`).join('')}</div><b>Gesamt: ${r.total} · Ø ${fmt(r.average)}</b></div>`).join('')||'<div class="hint">Keine separaten Rundendaten vorhanden.</div>'}</div><h3>📈 DRL-Historie</h3><div class="hist">${hist.map(h=>`<div>${esc(h.date||h.year)} · Platz ${h.rank??'–'} · Wert ${fmt(h.value)||'–'} · ${esc(h.club||'')}</div>`).join('')||'Keine DRL-Historie.'}</div>`;profile.scrollIntoView({behavior:'smooth',block:'start'})}
function showTournament(code){let ts=tournaments.find(t=>String(t.code||t.tournament_id)===String(code));let rs=results.filter(r=>String(r.tournament_code)===String(code));profile.style.display='block';profile.innerHTML=`<h2>🏆 ${esc(ts?.name||code)}</h2><div class="grid"><div class="card"><b>Code</b><br>${esc(code)}</div><div class="card"><b>Ort</b><br>${esc(ts?.location)}</div><div class="card"><b>Teilnehmer</b><br>${rs.length}</div><div class="card"><b>Mit Runden</b><br>${rs.filter(r=>r.rounds_available).length}</div></div><div class="table"><table><thead><tr><th>Platz</th><th>Spieler</th><th>Verein</th><th>Runden</th><th>Gesamt</th><th>Ø</th></tr></thead><tbody>${rs.sort((a,b)=>(Number(a.place)||99999)-(Number(b.place)||99999)).map(r=>`<tr><td>${r.place??'–'}</td><td><button class="linkbtn" data-result-player="${esc(r.player_key)}">${esc(r.name)}</button></td><td>${esc(r.club)}</td><td>${r.rounds_available?(r.rounds||[]).map((v,i)=>`R${i+1}: ${v}`).join(' · '):'–'}</td><td>${r.total??'–'}</td><td>${fmt(r.average)||'–'}</td></tr>`).join('')}</tbody></table></div>`;profile.scrollIntoView({behavior:'smooth',block:'start'})}
function events(){
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
 [q,f1,f2].forEach(x=>x.oninput=render);
 document.addEventListener('click',e=>{
  let b=e.target.closest('[data-player]');
  if(b){showPlayer(Number(b.dataset.player));return}
  let t=e.target.closest('[data-tournament]');
  if(t){showTournament(t.dataset.tournament);return}
  let c=e.target.closest('[data-club]');
  if(c){
   let n=c.dataset.club, ps=players.filter(p=>norm(p.club)===norm(n));
   profile.style.display='block';
   profile.innerHTML=`<h2>🏟️ ${esc(n)}</h2><div class="hist">${ps.map(p=>`<div class="roundbox"><button class="linkbtn" data-player="${players.indexOf(p)}">${esc(p.name)}</button> · ${esc(p.pass||'–')} · ${esc(p.lv||'')}</div>`).join('')}</div>`;
   profile.scrollIntoView({behavior:'smooth',block:'start'});return
  }
  let lv=e.target.closest('[data-lv]');
  if(lv){
   let n=lv.dataset.lv, ps=players.filter(p=>norm(p.lv)===norm(n));
   profile.style.display='block';
   profile.innerHTML=`<h2>🌐 ${esc(n)}</h2><p>${ps.length} Spieler</p><div class="hist">${uniq(clubs.filter(c=>(c.associations||[]).some(a=>norm(a)===norm(n))).map(c=>c.name)).map(c=>`<div class="roundbox"><button class="linkbtn" data-club="${esc(c)}">${esc(c)}</button></div>`).join('')}</div>`;
   profile.scrollIntoView({behavior:'smooth',block:'start'});return
  }
  let rp=e.target.closest('[data-result-player],[data-round-player]');
  if(rp){
   let key=rp.dataset.resultPlayer||rp.dataset.roundPlayer;
   let i=players.findIndex(p=>String(p.pass||'')===String(key));
   if(i<0)i=players.findIndex(p=>`idx:${players.indexOf(p)}`===key);
   if(i>=0)showPlayer(i);
  }
 });
}
events();load().catch(err=>{console.error(err);$('rows').innerHTML='<tr><td>Fehler beim Laden der Daten.</td></tr>';$('stand').textContent='Ladefehler – Datenstruktur prüfen.'});
</script></body></html>
