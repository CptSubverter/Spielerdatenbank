<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf.net – Spielerdatenbank</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#173042;background:#3D3D3D}.wrap{max-width:1450px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#1687d9,#72c7fb);color:#fff;padding:18px;border-radius:14px}.head h1{margin:0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button,.sort button,.letters button{border:1px solid #cfe3ef;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:650}.tabs button.active,.sort button.active{background:#1687d9;color:#fff}.panel{background:#f5f9fc;border-radius:12px;padding:12px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.controls input,.controls select{padding:11px;border:1px solid #cfe3ef;border-radius:8px;font-size:15px}.letters{display:flex;gap:4px;flex-wrap:wrap;margin:9px 0}.stats,.hint{margin:9px 0}.hint{background:#eef8ff;border:1px solid #cfeaf9;border-radius:8px;padding:9px}.table{overflow:auto;background:#fff;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:720px}th{background:#1687d9;color:#fff;text-align:left;padding:8px}td{padding:7px;border-bottom:1px solid #e7eef3}.linkbtn{border:0;background:none;color:#087fc9;font-weight:700;cursor:pointer;padding:0;text-align:left}.profile{margin:12px 0;background:#fff;border-radius:10px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.card{background:#f7fbfe;border:1px solid #d8eaf5;border-radius:8px;padding:9px}.hist{max-height:650px;overflow:auto}.round{padding:8px;border:1px solid #d8eaf5;border-radius:8px;margin:6px 0;background:#fff}.sort{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.small{font-size:12px;color:#5d7380}@media(max-width:700px){.controls{grid-template-columns:1fr}.wrap{padding:6px}}
</style></head><body><div class="wrap"><div class="head"><h1>🏆 Bahnengolf.net – Spielerdatenbank</h1><div>Spieler · Ergebnisse · Runden · Vereine · Verbände · Turniere</div><small id="stand">Daten werden geladen …</small></div><div class="tabs" id="tabs"><button data-mode="dashboard">📊 Übersicht</button><button data-mode="global">🔎 Gesamtsuche</button><button data-mode="players" class="active">👤 Spieler</button><button data-mode="clubs">🏟️ Vereine</button><button data-mode="lvs">🌐 Verbände</button><button data-mode="tournaments">🏆 Turniere</button><button id="quality">🧪 Datenprüfung</button></div><div class="panel"><div class="hint" id="hint"></div><div class="controls"><input id="q" placeholder="🔎 Spieler, Verein, Verband oder Turnier suchen …"><select id="f1"></select><select id="f2"></select></div><div class="letters" id="letters"></div><div class="stats"><b id="count">0</b> Treffer · <span id="total">0</span> Einträge</div><div id="profile" class="profile" style="display:none"></div><div class="table"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></div></div><script>
const $=id=>document.getElementById(id),norm=s=>String(s??'').toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,''),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uniq=a=>[...new Map(a.filter(Boolean).map(x=>[norm(x),String(x)])).values()].sort((a,b)=>a.localeCompare(b,'de')),clubNorm=s=>norm(s).replace(/\b(e\.?v\.?|i{1,3}|[1-3])\s*$/,'').trim();
let players=[],clubs=[],lvs=[],tournaments=[],mode='players';
function playerClub(p){return String(p.club||'').trim()}
function build(){const cm=new Map(),lm=new Set(),tm=new Map();players.forEach((p,i)=>{const c=playerClub(p);if(c){const k=clubNorm(c);let x=cm.get(k);if(!x)x={name:c,players:[]};if(!x.players.includes(i))x.players.push(i);if(c.length<x.name.length)x.name=c;cm.set(k,x)}if(p.lv)lm.add(String(p.lv));(p.tournaments||[]).forEach(t=>{const code=String(t.code||'').trim();if(!code)return;const m=code.match(/^(\d{4})[ ._:-]*(.*)$/),year=m?m[1]:'',name=(m?m[2]:code).replace(/^[-–—:|]+\s*/,'').trim(),k=year+'|'+norm(name);let x=tm.get(k);if(!x)x={id:k,name:name||code,year,codes:[],players:new Set(),records:[]};if(!x.codes.includes(code))x.codes.push(code);x.players.add(i);x.records.push({i,t});tm.set(k,x)});});clubs=[...cm.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'));lvs=uniq([...lm]);tournaments=[...tm.values()].map(x=>({...x,players:x.players.size})).sort((a,b)=>String(a.year+a.name).localeCompare(String(b.year+b.name),'de'))}
function load(){Promise.all(Array.from({length:8},(_,i)=>fetch(`data/players-${String(i+1).padStart(2,'0')}.json?${Date.now()}`).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}))).then(a=>{players=a.flat();build();$('stand').textContent=`${players.length.toLocaleString('de-DE')} Spieler · ${tournaments.length.toLocaleString('de-DE')} zusammengeführte Turniere`;setMode('players')}).catch(e=>{$('stand').textContent='Fehler beim Laden: '+e.message;$('rows').innerHTML='<tr><td>Die Daten konnten nicht geladen werden.</td></tr>'})}
function letters(){ $('letters').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZÄÖÜ'.split('').map(l=>`<button data-letter="${l}">${l}</button>`).join('') }
function filters(){ $('f1').innerHTML='<option value="">Alle Vereine</option>'+clubs.map(c=>`<option>${esc(c.name)}</option>`).join('');$('f2').innerHTML='<option value="">Alle Jahre</option>'+uniq(players.flatMap(p=>(p.history||[]).map(h=>String(h.date||'').slice(0,4)))).sort().reverse().map(y=>`<option>${y}</option>`).join('') }
function render(){const term=norm($('q').value),fc=$('f1').value,fy=$('f2').value;let a=[];if(mode==='players'){a=players.map((p,i)=>({p,i})).filter(x=>(!term||norm([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(term))&&(!fc||clubNorm(x.p.club)===clubNorm(fc))&&(!fy||String(x.p.history||[]).includes(fy)));$('thead').innerHTML='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Pass</th><th>DRL</th><th>Wert</th></tr>';$('rows').innerHTML=a.slice(0,1000).map(x=>`<tr><td><button class="linkbtn" data-player="${x.i}">${esc(x.p.name)}</button></td><td>${esc(x.p.club)}</td><td>${esc(x.p.lv)}</td><td>${esc(x.p.pass)}</td><td>${esc(x.p.rank??'')}</td><td>${esc(x.p.value??'')}</td></tr>`).join('')}else if(mode==='clubs'){a=clubs.filter(c=>(!term||norm(c.name+' '+c.lv).includes(term))&&(!fc||clubNorm(c.name)===clubNorm(fc)));$('thead').innerHTML='<tr><th>Verein</th><th>Spieler</th></tr>';$('rows').innerHTML=a.map(c=>`<tr><td><button class="linkbtn" data-club="${encodeURIComponent(c.name)}">${esc(c.name)}</button></td><td>${c.players.length}</td></tr>`).join('')}else if(mode==='lvs'){a=lvs.filter(x=>!term||norm(x).includes(term));$('thead').innerHTML='<tr><th>Verband</th><th>Vereine</th><th>Spieler</th></tr>';$('rows').innerHTML=a.map(x=>`<tr><td><button class="linkbtn" data-lv="${encodeURIComponent(x)}">${esc(x)}</button></td><td>${clubs.filter(c=>norm(c.lv)===norm(x)).length}</td><td>${players.filter(p=>norm(p.lv)===norm(x)).length}</td></tr>`).join('')}else if(mode==='tournaments'){a=tournaments.filter(t=>(!term||norm(t.name+' '+t.year).includes(term))&&(!$('f1').value||t.year===$('f1').value));$('thead').innerHTML='<tr><th>Turnier</th><th>Jahr</th><th>Spieler</th><th>Codes</th></tr>';$('rows').innerHTML=a.map(t=>`<tr><td><button class="linkbtn" data-tournament="${encodeURIComponent(t.id)}">${esc(t.name)}</button></td><td>${t.year}</td><td>${t.players}</td><td>${t.codes.length}</td></tr>`).join('')}else if(mode==='global'){globalSearch();return} $('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=(mode==='players'?players.length:mode==='clubs'?clubs.length:mode==='lvs'?lvs.length:tournaments.length).toLocaleString('de-DE')}
function globalSearch(){const t=norm($('q').value);$('f1').style.display=$('f2').style.display='none';if(!t){$('rows').innerHTML='<tr><td>Suchbegriff eingeben.</td></tr>';return}const ps=players.map((p,i)=>({p,i})).filter(x=>norm([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(t)).slice(0,100),cs=clubs.filter(c=>norm(c.name+' '+c.lv).includes(t)).slice(0,100),ls=lvs.filter(x=>norm(x).includes(t)).slice(0,100),ts=tournaments.filter(x=>norm(x.name+' '+x.year).includes(t)).slice(0,100);$('thead').innerHTML='<tr><th>Typ</th><th>Treffer</th><th>Info</th></tr>';$('rows').innerHTML=ps.map(x=>`<tr><td>Spieler</td><td><button class="linkbtn" data-player="${x.i}">${esc(x.p.name)}</button></td><td>${esc(x.p.club)}</td></tr>`).join('')+cs.map(x=>`<tr><td>Verein</td><td><button class="linkbtn" data-club="${encodeURIComponent(x.name)}">${esc(x.name)}</button></td><td>${x.players.length} Spieler</td></tr>`).join('')+ls.map(x=>`<tr><td>Verband</td><td><button class="linkbtn" data-lv="${encodeURIComponent(x)}">${esc(x)}</button></td><td></td></tr>`).join('')+ts.map(x=>`<tr><td>Turnier</td><td><button class="linkbtn" data-tournament="${encodeURIComponent(x.id)}">${esc(x.name)}</button></td><td>${x.year} · ${x.players} Spieler</td></tr>`).join('');$('count').textContent=ps.length+cs.length+ls.length+ts.length;$('total').textContent=''}
function showPlayer(i){const p=players[i];if(!p)return;const ts=(p.tournaments||[]).slice().sort((a,b)=>String(b.code||'').localeCompare(String(a.code||'')));const hs=(p.history||[]).slice();$('profile').style.display='block';$('profile').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="grid"><div class="card"><b>Pass</b><br>${esc(p.pass||'–')}</div><div class="card"><b>Verein</b><br><button class="linkbtn" data-club="${encodeURIComponent(p.club||'')}">${esc(p.club||'–')}</button></div><div class="card"><b>Verband</b><br><button class="linkbtn" data-lv="${encodeURIComponent(p.lv||'')}">${esc(p.lv||'–')}</button></div><div class="card"><b>DRL-Platz</b><br>${esc(p.rank??'–')}</div><div class="card"><b>Turnierteilnahmen</b><br>${ts.length}</div><div class="card"><b>DRL-Historie</b><br>${hs.length}</div></div><div class="sort"><button data-close>✕ Profil schließen</button></div><h3>🏆 Turnierteilnahmen</h3><div class="hist">${ts.map(t=>{const id=String(t.code||'');const g=tournaments.find(x=>x.codes.includes(id));return `<div class="round"><button class="linkbtn" data-tournament="${encodeURIComponent(g?g.id:id)}"><b>${esc(g?g.name:id)}</b></button> · ${esc(g?.year||'')}<br><span class="small">${esc(t.date||'')} · Platz ${esc(t.place??'–')} · Ergebnis ${esc(t.value??t.total??'–')}</span>${t.rounds?`<br><span class="small">Runden: ${Array.isArray(t.rounds)?t.rounds.map((r,j)=>'R'+(j+1)+' '+r).join(' · '):esc(t.rounds)}</span>`:''}</div>`}).join('')||'<div class="hint">Keine Turnierteilnahmen vorhanden.</div>'}</div>`;$('profile').scrollIntoView({behavior:'smooth',block:'start'})}
function showClub(name){const c=clubs.find(x=>clubNorm(x.name)===clubNorm(name));if(!c)return;$('profile').style.display='block';$('profile').innerHTML=`<h2>🏟️ ${esc(c.name)}</h2><div class="grid"><div class="card"><b>Spieler</b><br>${c.players.length}</div><div class="card"><b>Verbände</b><br>${uniq(c.players.map(i=>players[i].lv)).join(', ')||'–'}</div></div><h3>Spieler</h3><div class="hist">${c.players.map(i=>`<div class="round"><button class="linkbtn" data-player="${i}">${esc(players[i].name)}</button> · ${esc(players[i].lv||'–')} · Pass ${esc(players[i].pass||'–')}</div>`).join('')}</div>`}
function showLv(lv){const cs=clubs.filter(c=>norm(c.lv)===norm(lv));const ps=players.map((p,i)=>({p,i})).filter(x=>norm(x.p.lv)===norm(lv));$('profile').style.display='block';$('profile').innerHTML=`<h2>🌐 ${esc(lv)}</h2><div class="grid"><div class="card"><b>Vereine</b><br>${cs.length}</div><div class="card"><b>Spieler</b><br>${ps.length}</div></div><h3>Vereine</h3><div class="hist">${cs.map(c=>`<div class="round"><button class="linkbtn" data-club="${encodeURIComponent(c.name)}">${esc(c.name)}</button> · ${c.players.length} Spieler</div>`).join('')}</div>`}
function showTournament(id){const t=tournaments.find(x=>x.id===id);if(!t)return;const ps=[...t.records];$('profile').style.display='block';$('profile').innerHTML=`<h2>🏆 ${esc(t.name)} ${esc(t.year)}</h2><div class="grid"><div class="card"><b>Spieler</b><br>${t.players}</div><div class="card"><b>Zusammengeführte Codes</b><br>${t.codes.length}</div></div><p class="small">Original-Codes: ${t.codes.map(esc).join(' · ')}</p><div class="table"><table><thead><tr><th>Spieler</th><th>Verein</th><th>Platz</th><th>Ergebnis</th></tr></thead><tbody>${ps.map(x=>{const p=players[x.i],r=x.t;return `<tr><td><button class="linkbtn" data-player="${x.i}">${esc(p.name)}</button></td><td>${esc(p.club)}</td><td>${esc(r.place??'–')}</td><td>${esc(r.value??r.total??'–')}</td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const years=uniq(players.flatMap(p=>(p.history||[]).map(h=>String(h.date||'').slice(0,4)))).sort();$('profile').style.display='block';$('profile').innerHTML=`<h2>📊 Datenbank-Übersicht</h2><div class="grid"><div class="card"><b>Spieler</b><br>${players.length.toLocaleString('de-DE')}</div><div class="card"><b>Vereine</b><br>${clubs.length.toLocaleString('de-DE')}</div><div class="card"><b>Verbände</b><br>${lvs.length}</div><div class="card"><b>Turniere</b><br>${tournaments.length.toLocaleString('de-DE')}</div></div><h3>Jahre mit DRL-Historie</h3><p>${years.join(' · ')}</p><div class="hint">Die Datenebene enthält Teilnahmen auch dann, wenn keine Einzelrunden vorhanden sind.</div>`}
function quality(){const dup=new Map();players.forEach((p,i)=>{if(p.pass){const a=dup.get(String(p.pass))||[];a.push(i);dup.set(String(p.pass),a)}});const d=[...dup].filter(x=>x[1].length>1);$('profile').style.display='block';$('profile').innerHTML=`<h2>🧪 Datenprüfung</h2><div class="grid"><div class="card"><b>Spieler</b><br>${players.length}</div><div class="card"><b>Doppelte Passnummern</b><br>${d.length}</div><div class="card"><b>Ohne Passnummer</b><br>${players.filter(p=>!p.pass).length}</div><div class="card"><b>Ohne Verein</b><br>${players.filter(p=>!p.club).length}</div><div class="card"><b>Ohne LV</b><br>${players.filter(p=>!p.lv).length}</div></div><h3>Doppelte Passnummern</h3><div class="hist">${d.slice(0,100).map(x=>`<div class="round"><b>${esc(x[0])}</b> · ${x[1].map(i=>`<button class="linkbtn" data-player="${i}">${esc(players[i].name)}</button>`).join(' · ')}</div>`).join('')||'<div class="hint">Keine gefunden.</div>'}</div>`}
function setMode(m){mode=m;$('profile').style.display='none';$('q').value='';$('f1').style.display=$('f2').style.display='';$('hint').textContent='';document.querySelectorAll('#tabs button[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='dashboard'){dashboard();return}if(m==='global'){$('f1').style.display=$('f2').style.display='none';$('hint').textContent='Gesamtsuche über Spieler, Vereine, Verbände und Turniere.'}else if(m==='players'){filters();letters();$('hint').textContent='Spieler suchen und anklicken, um das vollständige Profil mit Turnierteilnahmen und Historie zu öffnen.'}else if(m==='clubs'){$('f1').innerHTML='<option value="">Alle Verbände</option>'+lvs.map(x=>`<option>${esc(x)}</option>`).join('');$('f2').style.display='none';$('hint').textContent='Vereinsnamen werden bei Teamzusätzen I/II/III bzw. 1/2/3 für die Zuordnung normalisiert.'}else if(m==='lvs'){$('f1').style.display=$('f2').style.display='none';$('hint').textContent='Verbände mit Vereinen und Spielern.'}else if(m==='tournaments'){$('f1').innerHTML='<option value="">Alle Jahre</option>'+uniq(tournaments.map(t=>t.year)).sort().reverse().map(y=>`<option>${y}</option>`).join('');$('f2').style.display='none';$('hint').textContent='Gleichnamige Turniere desselben Jahres werden zusammengeführt; Original-Codes bleiben erhalten.'}render()}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='quality'){quality();return}if(b.dataset.mode){setMode(b.dataset.mode);return}};$('q').oninput=()=>mode==='global'?globalSearch():render();$('f1').onchange=render;$('f2').onchange=render;$('letters').onclick=e=>{const b=e.target.closest('button');if(b){$('q').value=b.textContent;render()}};document.addEventListener('click',e=>{const b=e.target.closest('[data-player],[data-club],[data-lv],[data-tournament],[data-close]');if(!b)return;e.preventDefault();if(b.hasAttribute('data-close'))$('profile').style.display='none';else if(b.dataset.player!=null)showPlayer(Number(b.dataset.player));else if(b.dataset.club!=null)showClub(decodeURIComponent(b.dataset.club));else if(b.dataset.lv!=null)showLv(decodeURIComponent(b.dataset.lv));else if(b.dataset.tournament!=null)showTournament(decodeURIComponent(b.dataset.tournament))});load();
</script></body></html>
