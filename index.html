<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf Spielerdatenbank</title><style>body{font:14px Arial;margin:0;background:#3d3d3d;color:#123}.w{max-width:1700px;margin:auto;padding:12px}.h{background:#2fa7fa;color:#fff;padding:18px;border-radius:12px}.h h1{margin:0 0 6px}nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}nav button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer}main{background:#f5f9fc;padding:12px;border-radius:10px}input,select{padding:9px;margin:3px}.bar{display:flex;gap:5px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}.stat{background:#fff;padding:10px;border-radius:9px}.stat b{display:block;font-size:19px;color:#1687d9}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2fa7fa;color:#fff;padding:7px;text-align:left;position:sticky;top:0}td{padding:6px;border-bottom:1px solid #ddd}.lnk{border:0;background:none;color:#0781c9;font-weight:bold;cursor:pointer;padding:0}.panel{background:#fff;border-radius:10px;padding:14px;margin-top:12px}.muted{color:#667}.chips .lnk{display:inline-block;background:#eef7fd;border:1px solid #d7e8f2;border-radius:15px;padding:4px 8px;margin:2px}.scroll{max-height:70vh;overflow:auto}</style></head><body><div class=w><header class=h><h1>🏆 Bahnengolf Spielerdatenbank</h1><div id=s>Starte Datenabgleich …</div></header><nav id=n><button data-m=p>👤 Spieler</button><button data-m=c>🏟️ Vereine</button><button data-m=a>🌐 Verbände</button><button data-m=t>🏆 Turniere</button><button data-m=r>📊 Ergebnisse</button><button data-m=d>📈 DRL</button><button data-m=m>📋 DMV-Liste</button></nav><main><div class=bar><input id=q placeholder="Alle Daten durchsuchen …"><select id=y><option value="">Alle Jahre</option></select></div><div id=stats class=stats></div><div id=o></div></main></div><script>
const $=id=>document.getElementById(id),N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim(),E=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let P=[],R=[],T=[],C=new Map(),A=new Map(),mode='p',history=[],resultById=new Map();const files=async u=>(await fetch(u+'?rel=5')).json();
function teamless(s){return String(s??'').trim().replace(/\s+(?:I{1,3}|IV|V|[1-5])\s*$/i,'').replace(/\s+e\.?\s*v\.?\s*$/i,'').trim()}function pkeys(p){return [p.id,p.playerId,p.player_id,p.pass,p.passnummer,p.name,p.fullName,p.playerName].filter(x=>x!=null).map(N)}function pname(z){return z?.playerName??z?.player_name??z?.spielerName??z?.spieler_name??z?.name??z?.fullName??''}function tname(z){return z?.tournamentName??z?.tournament_name??z?.turnierName??z?.turnier_name??z?.tournament??z?.turnier??z?.eventName??z?.event_name??z?.code??''}function addT(z){let name=tname(z);if(!name)return;let year=String(z.year??z.jahr??String(z.date??z.datum??'').slice(0,4)),place=z.place??z.ort??z.location??'',date=z.date??z.datum??'',url=z.url??z.resultUrl??z.result_url??'',k=year+'|'+N(name)+'|'+N(place);let t=T.find(x=>x.key===k);if(!t){t={id:'T'+T.length,key:k,year,name,date,place,url,resultIds:[],playerIds:new Set,clubKeys:new Set};T.push(t)}else{if(!t.url&&url)t.url=url;if(!t.date&&date)t.date=date}}function playerIdsFor(z,map){let vals=['playerId','player_id','spielerId','spieler_id','pass','passnummer','playerName','player_name','spielerName','spieler_name','name','fullName'].flatMap(k=>{let v=z?.[k];return v&&typeof v==='object'?[v.id,v.playerId,v.pass,v.name]:[v]}).filter(v=>v!=null);let keys=vals.flatMap(v=>{let k=N(v),a=[k];if(String(v).includes(',')){let x=String(v).split(',',2);a.push(N(x[1]+' '+x[0]))}return a});return [...new Set(keys.flatMap(k=>map.get(k)||[]))]}
async function load(){try{for(let i=1;i<=8;i++){let x=await files('data/players-'+String(i).padStart(2,'0')+'.json');P.push(...(Array.isArray(x)?x:x.players||[]));$('s').textContent=P.length.toLocaleString('de-DE')+' Spieler geladen …'}let map=new Map();P.forEach((p,i)=>pkeys(p).forEach(k=>{let q=map.get(k)||[];q.push(i);map.set(k,q)}));for(let i=1;i<=8;i++){let x=await files('data/results-'+String(i).padStart(2,'0')+'.json'),a=Array.isArray(x)?x:(x.results||x.ergebnisse||x.participations||x.teilnahmen||x.data||[]);$('s').textContent='Verknüpfe Ergebnisse '+i+'/8 …';a.forEach((z,j)=>{addT(z);let ids=playerIdsFor(z,map),p=ids.length===1?ids[0]:null,name=tname(z),year=String(z.year??z.jahr??String(z.date??z.datum??'').slice(0,4)),place=z.place??z.ort??z.location??'',r={id:'R'+R.length,p,matchStatus:ids.length===1?'matched':ids.length?'ambiguous':'unresolved',year,date:z.date??z.datum??'',name,place,rank:z.rank??z.platz??z.position??'',rounds:z.rounds??z.runden??z.scores??[],total:z.total??z.result??z.ergebnis??z.score??z.value??'',url:z.url??z.resultUrl??z.result_url??''};R.push(r);resultById.set(r.id,r);let t=T.find(q=>q.key===year+'|'+N(name)+'|'+N(place));if(t){t.resultIds.push(r.id);if(p!=null)t.playerIds.add(p)}})}P.forEach((p,i)=>{p._i=i;p._r=[];let c=teamless(p.club||'');if(c){let k=N(c);if(!C.has(k))C.set(k,{key:k,name:c,players:new Set,results:new Set,tournaments:new Set}) ;C.get(k).players.add(i)}if(p.lv){let k=N(p.lv);if(!A.has(k))A.set(k,{key:k,name:p.lv,players:new Set,results:new Set,tournaments:new Set,clubs:new Set});A.get(k).players.add(i)}});R.forEach(r=>{if(r.p!=null){P[r.p]._r.push(r);let c=teamless(P[r.p].club||'');if(c&&C.has(N(c)))C.get(N(c)).results.add(r.id);let lv=P[r.p].lv;if(lv&&A.has(N(lv)))A.get(N(lv)).results.add(r.id)}let t=T.find(x=>x.resultIds.includes(r.id));if(t&&r.p!=null){let c=teamless(P[r.p].club||'');if(c&&C.has(N(c)))C.get(N(c)).tournaments.add(t.id);if(P[r.p].lv&&A.has(N(P[r.p].lv))){A.get(N(P[r.p].lv)).tournaments.add(t.id);if(c)A.get(N(P[r.p].lv)).clubs.add(N(c))}}});T.forEach(t=>{t.playerIds=[...t.playerIds];t.resultIds=[...new Set(t.resultIds)]});let ys=[...new Set([...T.map(t=>t.year),...R.map(r=>r.year)].filter(Boolean))].sort().reverse();$('y').innerHTML='<option value="">Alle Jahre</option>'+ys.map(y=>'<option>'+E(y)+'</option>').join('');$('stats').innerHTML='<div class=stat><b>'+P.length.toLocaleString('de-DE')+'</b>Spieler</div><div class=stat><b>'+R.length.toLocaleString('de-DE')+'</b>Ergebnisse</div><div class=stat><b>'+T.length.toLocaleString('de-DE')+'</b>Turniere</div><div class=stat><b>'+C.size.toLocaleString('de-DE')+'</b>Vereine</div><div class=stat><b>'+A.size+'</b>Verbände</div><div class=stat><b>'+R.filter(r=>r.matchStatus==='unresolved').length.toLocaleString('de-DE')+'</b>ungeklärte Ergebnisse</div>';$('s').textContent='Daten geladen · Beziehungen aufgebaut';draw()}catch(e){$('s').textContent='Fehler beim Datenabgleich: '+e.message}}
function btn(type,id,text){return '<button class=lnk data-'+type+'="'+E(id)+'">'+E(text||'—')+'</button>'}function go(type,id){history.push({mode,query:$('q').value,year:$('y').value});detail(type,id)}function navBack(){let h=history.pop();if(h){mode=h.mode;$('q').value=h.query;$('y').value=h.year;draw()}else draw()}
function draw(){let q=N($('q').value),y=$('y').value,h='',b='';if(mode==='p'){let a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.club,x.p.lv,x.p.pass].join(' ')).includes(q));h='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Pass</th><th>Ergebnisse</th></tr>';b=a.slice(0,1500).map(x=>'<tr><td>'+btn('p',x.i,x.p.name)+'</td><td>'+btn('c',N(teamless(x.p.club||'')),teamless(x.p.club||''))+'</td><td>'+btn('a',N(x.p.lv||''),x.p.lv||'')+'</td><td>'+E(x.p.pass||x.p.passnummer||'')+'</td><td>'+x.p._r.length+'</td></tr>').join('')}else if(mode==='c'){let a=[...C.values()].filter(x=>!q||N(x.name).includes(q));h='<tr><th>Verein</th><th>Spieler</th><th>Ergebnisse</th><th>Turniere</th></tr>';b=a.map(x=>'<tr><td>'+btn('c',x.key,x.name)+'</td><td>'+x.players.size+'</td><td>'+x.results.size+'</td><td>'+x.tournaments.size+'</td></tr>').join('')}else if(mode==='a'){let a=[...A.values()].filter(x=>!q||N(x.name).includes(q));h='<tr><th>Verband/LV</th><th>Spieler</th><th>Vereine</th><th>Ergebnisse</th><th>Turniere</th></tr>';b=a.map(x=>'<tr><td>'+btn('a',x.key,x.name)+'</td><td>'+x.players.size+'</td><td>'+x.clubs.size+'</td><td>'+x.results.size+'</td><td>'+x.tournaments.size+'</td></tr>').join('')}else if(mode==='t'){let a=T.filter(x=>(!q||N([x.name,x.place,x.year].join(' ')).includes(q))&&(!y||x.year===y));h='<tr><th>Turnier</th><th>Jahr</th><th>Ort</th><th>Spieler</th><th>Ergebnisse</th></tr>';b=a.map(x=>'<tr><td>'+btn('t',x.id,x.name)+'</td><td>'+E(x.year)+'</td><td>'+E(x.place)+'</td><td>'+x.playerIds.length+'</td><td>'+x.resultIds.length+'</td></tr>').join('')}else if(mode==='r'){let a=R.filter(x=>(!q||N([x.name,x.place,x.year,x.p!=null?P[x.p]?.name:'',x.club].join(' ')).includes(q))&&(!y||x.year===y));h='<tr><th>Spieler</th><th>Turnier</th><th>Jahr</th><th>Platz</th><th>Runden</th><th>Gesamt</th><th>Status</th></tr>';b=a.slice(0,2000).map(x=>'<tr><td>'+btn('p',x.p,x.p!=null?P[x.p]?.name:'Ungeklärt')+'</td><td>'+btn('r',x.id,x.name)+'</td><td>'+E(x.year)+'</td><td>'+E(x.rank)+'</td><td>'+E((x.rounds||[]).join(', '))+'</td><td>'+E(x.total)+'</td><td>'+E(x.matchStatus)+'</td></tr>').join('')}else if(mode==='d'){location.href='drl.html';return}else{let a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(q));h='<tr><th>DMV-Spieler</th><th>Pass</th><th>Verein</th><th>LV</th><th>Verknüpfung</th></tr>';b=a.slice(0,1500).map(x=>'<tr><td>'+btn('p',x.i,x.p.name)+'</td><td>'+E(x.p.pass||x.p.passnummer||'')+'</td><td>'+btn('c',N(teamless(x.p.club||'')),teamless(x.p.club||''))+'</td><td>'+btn('a',N(x.p.lv||''),x.p.lv||'')+'</td><td>'+x.p._r.length+' Ergebnisse</td></tr>').join('')}$('o').innerHTML='<div class=panel><div class=muted>Treffer werden auf die ersten Datensätze begrenzt, um den Browser nicht zu überlasten.</div><div class=scroll><table><thead>'+h+'</thead><tbody>'+(b||'<tr><td colspan=7>Keine Treffer</td></tr>')+'</tbody></table></div></div>'}
function profile(i){let p=P[+i];if(!p)return;let rs=p._r||[],c=teamless(p.club||''),lv=p.lv||'';$('o').innerHTML='<div class=panel><button class=lnk data-back=1>← Übersicht</button><h2>👤 '+E(p.name)+'</h2><p><b>Verein:</b> '+(c?btn('c',N(c),c):'—')+' · <b>LV:</b> '+(lv?btn('a',N(lv),lv):'—')+' · <b>Pass:</b> '+E(p.pass||p.passnummer||'—')+'</p><p class=muted>'+rs.length+' verknüpfte Ergebnisse</p><div class=scroll><table><tr><th>Jahr</th><th>Turnier</th><th>Ort</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'+rs.map(r=>{let t=T.find(x=>x.resultIds.includes(r.id));return '<tr><td>'+E(r.year)+'</td><td>'+btn('t',t?.id||'',r.name)+'</td><td>'+E(r.place)+'</td><td>'+E(r.rank)+'</td><td>'+E((r.rounds||[]).join(', '))+'</td><td>'+E(r.total)+'</td></tr>'}).join('')+'</table></div></div>'}function resultDetail(id){let r=resultById.get(id);if(!r)return;let t=T.find(x=>x.resultIds.includes(id)),p=r.p!=null?P[r.p]:null;$('o').innerHTML='<div class=panel><button class=lnk data-back=1>← Übersicht</button><h2>📊 Ergebnis</h2><p><b>Spieler:</b> '+(p?btn('p',r.p,p.name):'Ungeklärt')+' · <b>Turnier:</b> '+(t?btn('t',t.id,t.name):E(r.name))+'</p><p>'+E(r.year)+' · '+E(r.date)+' · '+E(r.place)+'</p><table><tr><th>Platz</th><th>Runden</th><th>Gesamt</th><th>Status</th></tr><tr><td>'+E(r.rank)+'</td><td>'+E((r.rounds||[]).join(', '))+'</td><td>'+E(r.total)+'</td><td>'+E(r.matchStatus)+'</td></tr></table>'+(r.url?'<p><a href="'+E(r.url)+'" target="_blank">Original-Ergebnis öffnen</a></p>':'')+'</div>'}
function detail(type,id){history.push({mode,query:$('q').value,year:$('y').value});if(type==='p'){profile(id);return}if(type==='r'){resultDetail(id);return}if(type==='c'){let c=C.get(id);if(!c)return;$('o').innerHTML='<div class=panel><button class=lnk data-back=1>← Übersicht</button><h2>🏟️ '+E(c.name)+'</h2><p>'+c.players.size+' Spieler · '+c.results.size+' Ergebnisse · '+c.tournaments.size+' Turniere</p><h3>Spieler</h3><div class=chips>'+[...c.players].map(i=>btn('p',i,P[i].name)).join(' ')+'</div><h3>Turniere</h3><div class=chips>'+[...c.tournaments].map(id=>{let t=T.find(x=>x.id===id);return t?btn('t',id,t.name+' ('+t.year+')'):''}).join(' ')+'</div></div>';return}if(type==='a'){let a=A.get(id);if(!a)return;$('o').innerHTML='<div class=panel><button class=lnk data-back=1>← Übersicht</button><h2>🌐 '+E(a.name)+'</h2><p>'+a.players.size+' Spieler · '+a.clubs.size+' Vereine · '+a.results.size+' Ergebnisse · '+a.tournaments.size+' Turniere</p><h3>Vereine</h3><div class=chips>'+[...a.clubs].map(k=>{let c=C.get(k);return c?btn('c',k,c.name):''}).join(' ')+'</div><h3>Spieler</h3><div class=chips>'+[...a.players].map(i=>btn('p',i,P[i].name)).join(' ')+'</div></div>';return}if(type==='t'){let t=T.find(x=>x.id===id);if(!t)return;$('o').innerHTML='<div class=panel><button class=lnk data-back=1>← Übersicht</button><h2>🏆 '+E(t.name)+'</h2><p>'+E(t.year)+' · '+E(t.date)+' · '+E(t.place)+'</p><p>'+t.resultIds.length+' Ergebnisse · '+t.playerIds.length+' Spieler</p><h3>Teilnehmer</h3><div class=chips>'+t.playerIds.map(i=>btn('p',i,P[i]?.name)).join(' ')+'</div><h3>Ergebnisse</h3><div class=scroll><table><tr><th>Spieler</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'+t.resultIds.map(id=>{let r=resultById.get(id);return r?'<tr><td>'+btn('p',r.p,r.p!=null?P[r.p]?.name:'Ungeklärt')+'</td><td>'+E(r.rank)+'</td><td>'+E((r.rounds||[]).join(', '))+'</td><td>'+E(r.total)+'</td></tr>':''}).join('')+'</table></div>'+(t.url?'<p><a href="'+E(t.url)+'" target="_blank">Original-Ergebnisse öffnen</a></p>':'')+'</div>'}}
$('n').onclick=e=>{let b=e.target.closest('[data-m]');if(!b)return;history=[];mode=b.dataset.m;draw()};$('q').oninput=draw;$('y').onchange=draw;document.addEventListener('click',e=>{let b=e.target.closest('[data-p],[data-c],[data-a],[data-t],[data-r],[data-back]');if(!b)return;if(b.dataset.back){navBack();return}if(b.dataset.p!=null)detail('p',b.dataset.p);else if(b.dataset.c!=null)detail('c',b.dataset.c);else if(b.dataset.a!=null)detail('a',b.dataset.a);else if(b.dataset.t!=null)detail('t',b.dataset.t);else if(b.dataset.r!=null)detail('r',b.dataset.r)});load();</script></body></html>
