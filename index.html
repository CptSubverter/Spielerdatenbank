<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf.net – Spielerdatenbank</title><style>body{margin:0;background:#3d3d3d;font:15px Arial;color:#173042}.wrap{max-width:1450px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#1687d9,#72c7fb);color:#fff;padding:18px;border-radius:14px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button,.action{padding:9px 12px;border:1px solid #cfe3ef;border-radius:8px;background:#fff;font-weight:bold;cursor:pointer}.tabs .active{background:#1687d9;color:#fff}.panel{background:#f5f9fc;padding:12px;border-radius:12px}.hint{background:#eef8ff;border:1px solid #cfeaf9;border-radius:8px;padding:10px;margin-bottom:10px}.controls{display:grid;grid-template-columns:2fr 1fr;gap:8px}.controls input,.controls select{padding:11px;border:1px solid #cfe3ef;border-radius:8px}.table{overflow:auto;margin-top:10px;background:#fff;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:750px}th{background:#1687d9;color:#fff;text-align:left;padding:8px}td{padding:7px;border-bottom:1px solid #e7eef3}.link{border:0;background:none;color:#087fc9;font-weight:bold;cursor:pointer}.profile{background:#fff;border-radius:10px;padding:14px;margin-top:10px}.ok{color:#16823b;font-weight:bold}.warn{color:#a65d00;font-weight:bold}</style></head><body><div class="wrap"><div class="head"><h1>🏆 Bahnengolf.net – Spielerdatenbank</h1><div>Spieler · Turniere · Ergebnisse · Runden · Vereine · Verbände</div><div id="status">Spielerdaten werden geladen …</div></div><div class="tabs"><button class="active" data-m="players">👤 Spieler</button><button data-m="clubs">🏟️ Vereine</button><button data-m="tournaments">🏆 Turniere</button><button data-m="search">🔎 Suche</button></div><div class="panel"><div id="hint" class="hint">Die Spielerstammdaten werden zuerst geladen. Die großen Ergebnisdateien werden danach einzeln geladen.</div><button id="results" class="action" disabled>📥 Ergebnisse & Turniere laden</button><div class="controls"><input id="q" placeholder="Spieler, Verein oder Turnier suchen …"><select id="filter"><option value="">Alle</option></select></div><div id="profile" class="profile" style="display:none"></div><div class="table"><table><thead id="head"></thead><tbody id="body"></tbody></table></div></div></div><script>
const $=x=>document.getElementById(x),N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),files=n=>Array.from({length:8},(_,i)=>`data/${n}-${String(i+1).padStart(2,'0')}.json`);let P=[],T=[],mode='players',loaded=0,matched=0;
async function loadPlayers(){for(let i=0;i<8;i++){try{$('status').textContent=`Spielerdaten ${i+1}/8 werden geladen …`;let r=await fetch(files('players')[i]+'?'+Date.now());if(!r.ok)throw Error(r.status);let x=await r.json();if(Array.isArray(x))P.push(...x);$('status').textContent=`${P.length.toLocaleString('de-DE')} Spieler geladen (${i+1}/8)`;draw()}catch(e){$('hint').innerHTML+=`<br><span class="warn">players-${String(i+1).padStart(2,'0')}: ${E(e.message)}</span>`}}$('results').disabled=false;$('hint').innerHTML='<span class="ok">✓ Spielerstammdaten vollständig geladen.</span> Jetzt können die Ergebnisdaten geladen werden.';draw()}
function playerId(p){return [p.id,p.playerId,p.pass,p.passnummer,p.name,p.fullName].filter(x=>x!==undefined&&x!==null&&String(x).trim()).map(N)}
function resultId(r){let a=[];for(let k of ['playerId','player_id','spielerId','spieler_id','pass','passnummer','pass_number','playerName','player_name','spielerName','spieler_name','name']){let v=r?.[k];if(v&&typeof v==='object')a.push(v.id,v.playerId,v.pass,v.name);else if(v!=null)a.push(v)}return a.filter(x=>String(x).trim()).map(N)}
function rname(r){let x=r?.tournamentName??r?.tournament_name??r?.turnierName??r?.turnier_name??r?.tournament??r?.turnier??r?.code??r?.tournamentCode??'';if(typeof x==='object')x=x.name??x.title??x.code??'';return String(x||'Unbekanntes Turnier')}
function merge(x){let rows=Array.isArray(x)?x:(x?.results||x?.ergebnisse||x?.participations||x?.teilnahmen||[]),map=new Map();P.forEach((p,i)=>playerId(p).forEach(k=>map.set(k,i)));for(let r of rows){let i=-1;for(let k of resultId(r))if(map.has(k)){i=map.get(k);break}if(i<0)continue;let p=P[i];p.tournaments=p.tournaments||[];let t={code:r.code??r.tournamentCode??r.tournament_code??'',name:rname(r),date:r.date??r.datum??'',place:r.place??r.platz??r.rank??'',value:r.value??r.result??r.ergebnis??r.total??r.score??'',rounds:r.rounds??r.runden??r.scores??''};let sig=[t.code,t.date,t.place,t.value].map(N).join('|');if(!p.tournaments.some(a=>[a.code,a.date,a.place,a.value??a.total].map(N).join('|')===sig)){p.tournaments.push(t);matched++}}}
async function loadResults(){let b=$('results');b.disabled=true;for(let i=0;i<8;i++){try{$('hint').textContent=`Ergebnisdatei ${i+1}/8 wird geladen …`;let r=await fetch(files('results')[i]+'?'+Date.now());if(!r.ok)throw Error(r.status);merge(await r.json());loaded++;draw()}catch(e){$('hint').innerHTML+=`<br><span class="warn">results-${String(i+1).padStart(2,'0')}: ${E(e.message)}</span>`}}b.disabled=false;$('hint').innerHTML=`<span class="ok">✓ ${loaded}/8 Ergebnisdateien verarbeitet.</span> ${matched.toLocaleString('de-DE')} neue Ergebnis-/Turniereinträge zugeordnet.`;draw()}
function clubs(){let m=new Map();P.forEach((p,i)=>{let c=String(p.club||'').trim();if(!c)return;let k=N(c).replace(/\b(e\.?v\.?|i{1,3}|[1-3])$/,'').trim();let x=m.get(k)||{name:c,p:[]};x.p.push(i);if(c.length<x.name.length)x.name=c;m.set(k,x)});return[...m.values()].sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function tournaments(){let m=new Map();P.forEach((p,i)=>(p.tournaments||[]).forEach(t=>{let code=String(t.code||''),name=String(t.name||rname(t)),z=code.match(/^(\d{4})[ ._:-]*(.*)$/),year=z?z[1]:'',title=(z?z[2]:name)||name,k=year+'|'+N(title);let x=m.get(k)||{name:title,year,p:[],codes:[]};if(!x.p.includes(i))x.p.push(i);if(code&&!x.codes.includes(code))x.codes.push(code);m.set(k,x)}));return[...m.values()].sort((a,b)=>(b.year+b.name).localeCompare(a.year+a.name,'de'))}
function draw(){let q=N($('q').value),f=$('filter').value;if(mode==='players'){let a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.club,x.p.pass,x.p.lv].join(' ')).includes(q));$('head').innerHTML='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Pass</th><th>Turniere/Ergebnisse</th></tr>';$('body').innerHTML=a.slice(0,1500).map(x=>`<tr><td><button class="link" data-p="${x.i}">${E(x.p.name)}</button></td><td>${E(x.p.club)}</td><td>${E(x.p.lv)}</td><td>${E(x.p.pass)}</td><td>${(x.p.tournaments||[]).length}</td></tr>`).join('')}else if(mode==='clubs'){let a=clubs().filter(x=>!q||N(x.name).includes(q));$('head').innerHTML='<tr><th>Verein</th><th>Spieler</th></tr>';$('body').innerHTML=a.map(x=>`<tr><td>${E(x.name)}</td><td>${x.p.length}</td></tr>`).join('')}else if(mode==='tournaments'){let a=tournaments().filter(x=>(!q||N(x.name+' '+x.year).includes(q))&&(!f||x.year===f));$('head').innerHTML='<tr><th>Turnier</th><th>Jahr</th><th>Spieler</th><th>Codes</th></tr>';$('body').innerHTML=a.map(x=>`<tr><td>${E(x.name)}</td><td>${x.year}</td><td>${x.p.length}</td><td>${x.codes.length}</td></tr>`).join('')}else{let a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.club,x.p.pass,x.p.lv].join(' ')).includes(q));$('head').innerHTML='<tr><th>Spieler</th><th>Verein</th><th>Turniere</th></tr>';$('body').innerHTML=a.slice(0,200).map(x=>`<tr><td><button class="link" data-p="${x.i}">${E(x.p.name)}</button></td><td>${E(x.p.club)}</td><td>${(x.p.tournaments||[]).length}</td></tr>`).join('')}$('status').textContent=`${P.length.toLocaleString('de-DE')} Spieler · ${matched.toLocaleString('de-DE')} zugeordnete Ergebnisse · ${loaded}/8 Ergebnisdateien`}
function show(i){let p=P[i],a=p.tournaments||[];$('profile').style.display='block';$('profile').innerHTML=`<h2>👤 ${E(p.name)}</h2><p><b>Verein:</b> ${E(p.club)} · <b>LV:</b> ${E(p.lv)} · <b>Pass:</b> ${E(p.pass)}</p><h3>🏆 Turniere & Ergebnisse (${a.length})</h3>${a.map(t=>`<div style="padding:8px;border:1px solid #d8eaf5;border-radius:8px;margin:5px 0"><b>${E(t.name||t.code||'Turnier')}</b><br>${E(t.date||'')} · Platz ${E(t.place||'–')} · Ergebnis ${E(t.value??t.total??'–')}${t.rounds?' · Runden: '+E(Array.isArray(t.rounds)?t.rounds.join(', '):t.rounds):''}</div>`).join('')||'<span class="warn">Noch keine Ergebnisdaten geladen.</span>'}`}
$('q').oninput=draw;$('results').onclick=loadResults;document.querySelector('.tabs').onclick=e=>{let b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('active',x===b));$('profile').style.display='none';if(mode==='tournaments')$('filter').innerHTML='<option value="">Alle Jahre</option>'+[...new Set(tournaments().map(x=>x.year).filter(Boolean))].sort().reverse().map(y=>`<option>${y}</option>`).join('');else $('filter').innerHTML='<option value="">Alle</option>';draw()};document.addEventListener('click',e=>{let b=e.target.closest('[data-p]');if(b)show(+b.dataset.p)});loadPlayers();</script></body></html>
