<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf Spielerdatenbank</title><style>body{font:14px Arial;margin:0;background:#3d3d3d;color:#123}.w{max-width:1600px;margin:auto;padding:12px}.h{background:#2fa7fa;color:#fff;padding:18px;border-radius:12px}.h h1{margin:0 0 6px}nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}nav button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer}main{background:#f5f9fc;padding:12px;border-radius:10px}input,select{padding:9px;margin:3px}.bar{display:flex;gap:5px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}.stat{background:#fff;padding:10px;border-radius:9px}.stat b{display:block;font-size:19px;color:#1687d9}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2fa7fa;color:#fff;padding:7px;text-align:left}td{padding:6px;border-bottom:1px solid #ddd}.lnk{border:0;background:none;color:#0781c9;font-weight:bold;cursor:pointer;padding:0}.panel{background:#fff;border-radius:10px;padding:14px;margin-top:12px}.muted{color:#667}.chips span{display:inline-block;background:#eef7fd;border:1px solid #d7e8f2;border-radius:15px;padding:3px 7px;margin:2px}.back{margin-bottom:8px}</style></head><body><div class=w><header class=h><h1>🏆 Bahnengolf Spielerdatenbank</h1><div id=s>Starte Datenabgleich …</div></header><nav id=n><button data-m=p>👤 Spieler</button><button data-m=c>🏟️ Vereine</button><button data-m=a>🌐 Verbände</button><button data-m=t>🏆 Turniere</button><button data-m=r>📊 Ergebnisse</button><button data-m=d>📈 DRL</button><button data-m=m>📋 DMV-Liste</button></nav><main><div class=bar><input id=q placeholder="Alle Daten durchsuchen …"><select id=y><option value="">Alle Jahre</option></select></div><div id=stats class=stats></div><div id=o></div></main></div><script>
const $=id=>document.getElementById(id),N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim(),E=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
let P=[],R=[],T=[],C=new Map(),A=new Map(),mode='p',selected=null;
const files=async u=>(await fetch(u+'?rel=3')).json();
function pkeys(p){return [p.id,p.playerId,p.player_id,p.pass,p.passnummer,p.name,p.fullName,p.playerName].filter(x=>x!=null).map(N)}
function teamless(s){s=String(s??'').trim();s=s.replace(/\s+(?:I{1,3}|IV|V|[1-5])\s*$/i,'');s=s.replace(/\s+e\.?\s*v\.?\s*$/i,'');return s.trim()}
function addT(z){let name=z.tournamentName??z.tournament_name??z.turnierName??z.turnier_name??z.tournament??z.turnier??z.eventName??z.event_name??z.code??'';if(!name)return;let year=String(z.year??z.jahr??String(z.date??z.datum??'').slice(0,4));let place=z.place??z.ort??z.location??'';let k=year+'|'+N(name)+'|'+N(place);if(!T.find(t=>t.key===k))T.push({key:k,year,name,date:z.date??z.datum??'',place,url:z.url??z.resultUrl??z.result_url??'',resultIds:[],playerIds:new Set})}
function rid(z,i){return 'R'+i}
async function load(){try{for(let i=1;i<=8;i++){let x=await files('data/players-'+String(i).padStart(2,'0')+'.json');P.push(...(Array.isArray(x)?x:x.players||[]));$('s').textContent=P.length.toLocaleString('de-DE')+' Spieler geladen …'}
let map=new Map();P.forEach((p,i)=>pkeys(p).forEach(k=>{let q=map.get(k)||[];q.push(i);map.set(k,q)}));
for(let i=1;i<=8;i++){let x=await files('data/results-'+String(i).padStart(2,'0')+'.json'),a=Array.isArray(x)?x:(x.results||x.ergebnisse||x.participations||x.teilnahmen||x.data||[]);$('s').textContent='Verknüpfe Ergebnisse '+i+'/8 …';a.forEach((z,j)=>{addT(z);let vals=['playerId','player_id','spielerId','spieler_id','pass','passnummer','playerName','player_name','spielerName','spieler_name','name','fullName'].flatMap(k=>{let v=z?.[k];return v&&typeof v==='object'?[v.id,v.playerId,v.pass,v.name]:[v]}).filter(v=>v!=null).flatMap(v=>{let k=N(v),q=[k];if(String(v).includes(',')){let x=String(v).split(',',2);q.push(N(x[1]+' '+x[0]))}return q});let ids=[...new Set(vals.flatMap(k=>map.get(k)||[]))];let p=ids.length===1?ids[0]:null;let name=z.tournamentName??z.tournament_name??z.turnierName??z.turnier_name??z.tournament??z.turnier??z.eventName??z.event_name??z.code??'';let year=String(z.year??z.jahr??String(z.date??z.datum??'').slice(0,4)),place=z.place??z.ort??z.location??'',tk=year+'|'+N(name)+'|'+N(place),t=T.find(q=>q.key===tk);let r={id:rid(z,i+'-'+j),p,year,date:z.date??z.datum??'',name,place,rank:z.rank??z.platz??z.position??'',rounds:z.rounds??z.runden??z.scores??[],total:z.total??z.result??z.ergebnis??z.score??z.value??'',url:z.url??z.resultUrl??z.result_url??''};R.push(r);if(t){t.resultIds.push(r.id);if(p!=null)t.playerIds.add(p)}})}
P.forEach((p,i)=>{p._i=i;p._r=[];let c=teamless(p.club||'');if(c){let k=N(c);if(!C.has(k))C.set(k,{name:c,players:new Set,results:[]});C.get(k).players.add(i)}if(p.lv){let k=N(p.lv);if(!A.has(k))A.set(k,{name:p.lv,players:new Set,results:[]});A.get(k).players.add(i)}});R.forEach(r=>{if(r.p!=null){P[r.p]._r.push(r);let c=teamless(P[r.p].club||'');if(c&&C.has(N(c)))C.get(N(c)).results.push(r.id);let lv=P[r.p].lv;if(lv&&A.has(N(lv)))A.get(N(lv)).results.push(r.id)}});T.forEach(t=>t.playerIds=[...t.playerIds]);
let ys=[...new Set(T.map(t=>t.year).filter(Boolean))].sort().reverse();$('y').innerHTML='<option value="">Alle Jahre</option>'+ys.map(y=>'<option>'+E(y)+'</option>').join('');$('stats').innerHTML='<div class=stat><b>'+P.length.toLocaleString('de-DE')+'</b>Spieler</div><div class=stat><b>'+R.length.toLocaleString('de-DE')+'</b>Ergebnisse</div><div class=stat><b>'+T.length.toLocaleString('de-DE')+'</b>Turniere</div><div class=stat><b>'+C.size.toLocaleString('de-DE')+'</b>Vereine</div><div class=stat><b>'+A.size+'</b>Verbände</div>';$('s').textContent='Daten geladen · Verknüpfungen aufgebaut';draw()}catch(e){$('s').textContent='Fehler beim Datenabgleich: '+e.message}}
function btn(type,id,text){return '<button class=lnk data-'+type+'="'+id+'">'+E(text)+'</button>'}
function draw(){let q=N($('q').value),y=$('y').value,h='',b='';if(mode==='p'){let a=P.map((p,i)=>({p,i})).filter(x=>(!q||N([x.p.name,x.p.club,x.p.lv,x.p.pass].join(' ')).includes(q)));h='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Ergebnisse</th></tr>';b=a.slice(0,1000).map(x=>'<tr><td>'+btn('p',x.i,x.p.name)+'</td><td>'+btn('c',N(teamless(x.p.club||'')),teamless(x.p.club||''))+'</td><td>'+btn('a',N(x.p.lv||''),x.p.lv||'')+'</td><td>'+x.p._r.length+'</td></tr>').join('')}else if(mode==='c'){let a=[...C.values()].filter(x=>!q||N(x.name).includes(q));h='<tr><th>Verein</th><th>Spieler</th><th>Ergebnisse</th></tr>';b=a.map(x=>'<tr><td>'+btn('c',N(x.name),x.name)+'</td><td>'+x.players.size+'</td><td>'+x.results.length+'</td></tr>').join('')}else if(mode==='a'){let a=[...A.values()].filter(x=>!q||N(x.name).includes(q));h='<tr><th>Verband/LV</th><th>Spieler</th><th>Ergebnisse</th></tr>';b=a.map(x=>'<tr><td>'+btn('a',N(x.name),x.name)+'</td><td>'+x.players.size+'</td><td>'+x.results.length+'</td></tr>').join('')}else if(mode==='t'){let a=T.filter(x=>(!q||N([x.name,x.place,x.year].join(' ')).includes(q))&&(!y||x.year===y));h='<tr><th>Turnier</th><th>Jahr</th><th>Ort</th><th>Spieler</th><th>Ergebnisse</th></tr>';b=a.map((x,i)=>'<tr><td>'+btn('t',i,x.name)+'</td><td>'+E(x.year)+'</td><td>'+E(x.place)+'</td><td>'+x.playerIds.length+'</td><td>'+x.resultIds.length+'</td></tr>').join('')}else if(mode==='r'){let a=R.filter(x=>(!q||N([x.name,x.place,x.year,(x.p!=null?P[x.p]?.name:'')].join(' ')).includes(q))&&(!y||x.year===y));h='<tr><th>Spieler</th><th>Turnier</th><th>Jahr</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>';b=a.slice(0,1000).map(x=>'<tr><td>'+btn('p',x.p,x.p!=null?P[x.p]?.name:'Ungeklärt')+'</td><td>'+E(x.name)+'</td><td>'+E(x.year)+'</td><td>'+E(x.rank)+'</td><td>'+E((x.rounds||[]).join(', '))+'</td><td>'+E(x.total)+'</td></tr>').join('')}else if(mode==='d'){location.href='drl.html';return}else{let a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(q));h='<tr><th>DMV-Spieler</th><th>Pass</th><th>Verein</th><th>LV</th></tr>';b=a.slice(0,1000).map(x=>'<tr><td>'+btn('p',x.i,x.p.name)+'</td><td>'+E(x.p.pass||x.p.passnummer||'')+'</td><td>'+E(teamless(x.p.club||''))+'</td><td>'+E(x.p.lv||'')+'</td></tr>').join('')}$('o').innerHTML='<div class=panel><table><thead>'+h+'</thead><tbody>'+(b||'<tr><td colspan=6>Keine Treffer</td></tr>')+'</tbody></table></div>'}
function profile(i){let p=P[i];if(!p)return;let rs=p._r||[];$('o').innerHTML='<div class=panel><button class=lnk data-back="1">← Übersicht</button><h2>👤 '+E(p.name)+'</h2><p><b>Verein:</b> '+btn('c',N(teamless(p.club||'')),teamless(p.club||''))+' · <b>LV:</b> '+btn('a',N(p.lv||''),p.lv||'')+' · <b>Pass:</b> '+E(p.pass||p.passnummer||'')+'</p><p class=muted>'+rs.length+' verknüpfte Ergebnisse</p><table><tr><th>Jahr</th><th>Turnier</th><th>Ort</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'+rs.map(r=>'<tr><td>'+E(r.year)+'</td><td>'+E(r.name)+'</td><td>'+E(r.place)+'</td><td>'+E(r.rank)+'</td><td>'+E((r.rounds||[]).join(', '))+'</td><td>'+E(r.total)+'</td></tr>').join('')+'</table></div>'}
function detail(type,id){if(type==='p'){profile(+id);return}if(type==='c'){let c=C.get(id);if(!c)return;$('o').innerHTML='<div class=panel><button class=lnk data-back="1">← Übersicht</button><h2>🏟️ '+E(c.name)+'</h2><p>'+c.players.size+' Spieler · '+c.results.length+' Ergebnisse</p><h3>Spieler</h3><div class=chips>'+[...c.players].map(i=>btn('p',i,P[i].name)).join(' · ')+'</div></div>';return}if(type==='a'){let a=A.get(id);if(!a)return;$('o').innerHTML='<div class=panel><button class=lnk data-back="1">← Übersicht</button><h2>🌐 '+E(a.name)+'</h2><p>'+a.players.size+' Spieler · '+a.results.length+' Ergebnisse</p><div class=chips>'+[...a.players].map(i=>btn('p',i,P[i].name)).join(' · ')+'</div></div>';return}if(type==='t'){let t=T[+id];if(!t)return;$('o').innerHTML='<div class=panel><button class=lnk data-back="1">← Übersicht</button><h2>🏆 '+E(t.name)+'</h2><p>'+E(t.year)+' · '+E(t.date)+' · '+E(t.place)+'</p><p>'+t.resultIds.length+' Ergebnisse · '+t.playerIds.length+' Spieler</p><h3>Teilnehmer</h3><div class=chips>'+t.playerIds.map(i=>btn('p',i,P[i]?.name)).join(' · ')+'</div>'+(t.url?'<p><a href="'+E(t.url)+'" target="_blank">Original-Ergebnisse öffnen</a></p>':'')+'</div>'}}
$('n').onclick=e=>{let b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;draw()};$('q').oninput=draw;$('y').onchange=draw;document.addEventListener('click',e=>{let b=e.target.closest('[data-p],[data-c],[data-a],[data-t],[data-back]');if(!b)return;if(b.dataset.back){draw();return}if(b.dataset.p!=null)detail('p',b.dataset.p);else if(b.dataset.c!=null)detail('c',b.dataset.c);else if(b.dataset.a!=null)detail('a',b.dataset.a);else if(b.dataset.t!=null)detail('t',b.dataset.t)});load();
</script></body></html>
