<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spielerdatenbank</title><style>body{font:14px Arial;margin:0;background:#3d3d3d;color:#123}.w{max-width:1500px;margin:auto;padding:12px}.h{background:#2fa7fa;color:white;padding:18px;border-radius:12px}button{cursor:pointer}nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}nav button{padding:9px;border:0;border-radius:7px}main{background:#f5f9fc;padding:12px;border-radius:10px}input,select{padding:9px;margin:3px}table{width:100%;border-collapse:collapse;background:white}th{background:#2fa7fa;color:white;padding:7px}td{padding:6px;border-bottom:1px solid #ddd}.lnk{border:0;background:none;color:#0781c9;font-weight:bold}</style><div class=w><header class=h><h1>🏆 Bahnengolf Spielerdatenbank</h1><div id=s>Starte …</div></header><nav id=n><button data-m=p>👤 Spieler</button><button data-m=c>🏟️ Vereine</button><button data-m=l>🌐 Verbände</button><button data-m=t>🏆 Turniere</button><button data-m=r>📊 Ergebnisse</button><button data-m=d>📈 DRL</button></nav><main><input id=q placeholder="Suche …"><select id=y><option value="">Alle Jahre</option></select><div id=o></div></main></div><script>
const $=id=>document.getElementById(id),norm=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim(),esc=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));let P=[],R=[],T=[],mode='p';const files=async u=>(await fetch(u+'?v=290c3f6')).json();
function addT(z){let name=z.tournamentName??z.tournament_name??z.turnierName??z.turnier_name??z.tournament??z.turnier??z.eventName??z.event_name??z.code??'';if(name)T.push({year:z.year??z.jahr??String(z.date??z.datum??'').slice(0,4),date:z.date??z.datum??'',name,place:z.place??z.ort??z.location??'',url:z.url??z.resultUrl??z.result_url??''})}
function pkeys(p){return [p.id,p.playerId,p.pass,p.passnummer,p.name,p.fullName,p.playerName].filter(x=>x!=null).map(norm)}
async function load(){try{for(let i=1;i<=8;i++){let x=await files('data/players-'+String(i).padStart(2,'0')+'.json');P.push(...(Array.isArray(x)?x:x.players||[]));$('s').textContent=P.length.toLocaleString('de-DE')+' Spieler geladen …'}let map=new Map;P.forEach((p,i)=>{p._i=i;pkeys(p).forEach(k=>{let a=map.get(k)||[];a.push(i);map.set(k,a)})});for(let i=1;i<=8;i++){ $('s').textContent='Ergebnisse '+i+'/8 …';let x=await files('data/results-'+String(i).padStart(2,'0')+'.json'),a=Array.isArray(x)?x:(x.results||x.ergebnisse||x.participations||x.teilnahmen||x.data||[]);for(let z of a){addT(z);let vals=['playerId','player_id','spielerId','spieler_id','pass','passnummer','playerName','player_name','spielerName','spieler_name','name','fullName'].flatMap(k=>{let v=z?.[k];return v&&typeof v==='object'?[v.id,v.playerId,v.pass,v.name]:[v]}).filter(v=>v!=null).flatMap(v=>{let k=norm(v),a=[k];if(String(v).includes(',')){let q=String(v).split(',',2);a.push(norm(q[1]+' '+q[0]))}return a});let ids=[...new Set(vals.flatMap(k=>map.get(k)||[]))];if(ids.length===1){let j=ids[0],p=P[j],r={p:j,year:z.year??z.jahr??String(z.date??z.datum??'').slice(0,4),date:z.date??z.datum??'',name:z.tournamentName??z.tournament_name??z.turnierName??z.turnier_name??z.tournament??z.turnier??z.eventName??z.event_name??z.code??'',place:z.place??z.ort??z.location??'',rank:z.rank??z.platz??z.position??'',rounds:z.rounds??z.runden??z.scores??[],total:z.total??z.result??z.ergebnis??z.score??z.value??''};R.push(r);(p._r||(p._r=[])).push(r)}}}let m=new Map;T.forEach(t=>{t.year=String(t.year);let k=t.year+'|'+norm(t.name);let v=m.get(k)||{...t,rows:0,places:new Set};v.rows++;if(t.place)v.places.add(t.place);m.set(k,v)});T=[...m.values()].map(x=>({...x,place:[...x.places].join(' / ')}));let years=[...new Set(T.map(x=>x.year).filter(Boolean))].sort().reverse();$('y').innerHTML='<option value="">Alle Jahre</option>'+years.map(y=>`<option>${esc(y)}</option>`).join('');$('s').textContent=`${P.length.toLocaleString('de-DE')} Spieler · ${R.length.toLocaleString('de-DE')} zugeordnete Ergebnisse · ${T.length.toLocaleString('de-DE')} Turniere`;draw()}catch(e){$('s').textContent='Fehler: '+e.message}}
function draw(){let q=norm($('q').value),y=$('y').value,a;if(mode==='p')a=P.map((p,i)=>({p,i})).filter(x=>!q||norm([x.p.name,x.p.club,x.p.lv,x.p.pass].join(' ')).includes(q));else if(mode==='t')a=T.filter(x=>(!q||norm([x.name,x.place,x.year].join(' ')).includes(q))&&(!y||x.year===y));else if(mode==='r')a=R.filter(x=>(!q||norm([x.name,x.place].join(' ')).includes(q))&&(!y||x.year===y));else if(mode==='c'){let m=new Map;P.forEach(p=>{let n=String(p.club||'').replace(/\b(e\.?\s*v\.?|i{1,3}|[1-3])$/i,'').trim(),k=norm(n);if(n)m.set(k,{name:n,lv:p.lv,count:(m.get(k)?.count||0)+1})});a=[...m.values()].filter(x=>!q||norm(x.name+' '+x.lv).includes(q))}else a=[...new Set(P.map(p=>p.lv).filter(Boolean))].filter(x=>!q||norm(x).includes(q));let h='',b='';if(mode==='p'){h='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Turniere</th></tr>';b=a.map(x=>`<tr><td><button class=lnk data-p=${x.i}>${esc(x.p.name)}</button></td><td>${esc(x.p.club)}</td><td>${esc(x.p.lv)}</td><td>${x.p._r?.length||0}</td></tr>`).join('')}else if(mode==='t'){h='<tr><th>Turnier</th><th>Jahr</th><th>Datum</th><th>Ort</th><th>Ergebniszeilen</th></tr>';b=a.map((x,i)=>`<tr><td><button class=lnk data-t=${i}>${esc(x.name)}</button></td><td>${x.year}</td><td>${esc(x.date)}</td><td>${esc(x.place)}</td><td>${x.rows}</td></tr>`).join('')}else if(mode==='r'){h='<tr><th>Spieler</th><th>Jahr</th><th>Turnier</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>';b=a.slice(0,500).map(x=>`<tr><td><button class=lnk data-p=${x.p}>${esc(P[x.p]?.name)}</button></td><td>${x.year}</td><td>${esc(x.name)}</td><td>${esc(x.rank)}</td><td>${esc((x.rounds||[]).join(', '))}</td><td>${esc(x.total)}</td></tr>`).join('')}else{h='<tr><th>Name</th><th>LV</th><th>Anzahl</th></tr>';b=a.map(x=>`<tr><td>${esc(x.name||x)}</td><td>${esc(x.lv||'')}</td><td>${x.count||P.filter(p=>p.lv===x).length}</td></tr>`).join('')}$('o').innerHTML=`<table><thead>${h}</thead><tbody>${b||'<tr><td colspan=6>Keine Treffer</td></tr>'}</tbody></table>`}
$('n').onclick=e=>{let b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;if(mode==='d'){location.href='drl.html';return}draw()};$('q').oninput=draw;$('y').onchange=draw;document.addEventListener('click',e=>{let b=e.target.closest('[data-p],[data-t]');if(!b)return;if(b.dataset.p!=null){let p=P[+b.dataset.p];$('o').innerHTML='<h2>👤 '+esc(p.name)+'</h2><p><b>Verein:</b> '+esc(p.club)+' · <b>LV:</b> '+esc(p.lv)+' · <b>Pass:</b> '+esc(p.pass)+'</p><h3>🏆 Turniere & Ergebnisse ('+(p._r?.length||0)+')</h3><table><tr><th>Jahr</th><th>Datum</th><th>Turnier</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'+((p._r||[]).map(r=>`<tr><td>${r.year}</td><td>${esc(r.date)}</td><td>${esc(r.name)}</td><td>${esc(r.rank)}</td><td>${esc((r.rounds||[]).join(', '))}</td><td>${esc(r.total)}</td></tr>`).join('')||'<tr><td colspan=6>Keine zugeordneten Ergebnisse</td></tr>')+'</table>'}else{let t=T[+b.dataset.t];$('o').innerHTML='<h2>🏆 '+esc(t.name)+'</h2><p>'+t.year+' · '+esc(t.date)+' · '+esc(t.place)+' · '+t.rows+' Ergebniszeilen</p>'+(t.url?'<p><a target=_blank href="'+esc(t.url)+'">Ergebnisse öffnen</a></p>':'')}});load();
</script>
