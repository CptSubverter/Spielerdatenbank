<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf.net – Spielerdatenbank</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;color:#173042;background:#3D3D3D}.wrap{max-width:1500px;margin:auto;padding:12px}.head{background:linear-gradient(135deg,#1687d9,#72c7fb);color:#fff;padding:18px;border-radius:14px}.head h1{margin:0}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button,.sort button{border:1px solid #cfe3ef;background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:650}.tabs button.active{background:#1687d9;color:#fff}.panel{background:#f5f9fc;border-radius:12px;padding:12px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}.controls input,.controls select{padding:11px;border:1px solid #cfe3ef;border-radius:8px;font-size:15px}.hint{margin:9px 0;background:#eef8ff;border:1px solid #cfeaf9;border-radius:8px;padding:9px}.table{overflow:auto;background:#fff;border-radius:9px}table{width:100%;border-collapse:collapse;min-width:820px}th{background:#1687d9;color:#fff;text-align:left;padding:8px}td{padding:7px;border-bottom:1px solid #e7eef3}.linkbtn{border:0;background:none;color:#087fc9;font-weight:700;cursor:pointer;padding:0;text-align:left}.profile{margin:12px 0;background:#fff;border-radius:10px;padding:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.card{background:#f7fbfe;border:1px solid #d8eaf5;border-radius:8px;padding:9px}.hist{max-height:720px;overflow:auto}.round{padding:8px;border:1px solid #d8eaf5;border-radius:8px;margin:6px 0;background:#fff}.small{font-size:12px;color:#5d7380}.ok{color:#16823b;font-weight:700}.warn{color:#b36b00;font-weight:700}@media(max-width:700px){.controls{grid-template-columns:1fr}.wrap{padding:6px}}</style></head><body><div class="wrap"><div class="head"><h1>🏆 Bahnengolf.net – Spielerdatenbank</h1><div>Spieler · Turniere · Ergebnisse · Runden · Vereine · Verbände</div><small id="stand">Spielerdaten werden geladen …</small></div><div class="tabs" id="tabs"><button data-mode="dashboard">📊 Übersicht</button><button data-mode="global">🔎 Gesamtsuche</button><button data-mode="players" class="active">👤 Spieler</button><button data-mode="clubs">🏟️ Vereine</button><button data-mode="lvs">🌐 Verbände</button><button data-mode="tournaments">🏆 Turniere</button><button id="quality">🧪 Datenprüfung</button></div><div class="panel"><div class="hint" id="hint">Spielerstammdaten werden geladen. Die Ergebnisdateien werden anschließend einzeln nachgeladen.</div><div class="controls"><input id="q" placeholder="🔎 Spieler, Verein, Verband oder Turnier suchen …"><select id="f1"></select><select id="f2"></select></div><div class="stats"><b id="count">0</b> Treffer · <span id="total">0</span> Einträge</div><div id="profile" class="profile" style="display:none"></div><div class="table"><table><thead id="thead"></thead><tbody id="rows"></tbody></table></div></div></div><script>
const $=id=>document.getElementById(id),norm=s=>String(s??'').toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,''),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),uniq=a=>[...new Map(a.filter(x=>String(x??'').trim()).map(x=>[norm(x),String(x)])).values()].sort((a,b)=>a.localeCompare(b,'de')),clubNorm=s=>norm(s).replace(/\b(e\.?v\.?|i{1,3}|[1-3])\s*$/,'').trim();
let players=[],clubs=[],lvs=[],tournaments=[],mode='players',resultRows=0,matchedResults=0,unmatchedResults=0,loadedResultFiles=0;
const playerFiles=Array.from({length:8},(_,i)=>`data/players-${String(i+1).padStart(2,'0')}.json`),resultFiles=Array.from({length:8},(_,i)=>`data/results-${String(i+1).padStart(2,'0')}.json`);
function val(o,keys){for(const k of keys)if(o&&o[k]!==undefined&&o[k]!==null&&String(o[k]).trim()!=='')return o[k];return ''}
function flatResults(x,parent={}){if(Array.isArray(x)){let out=[];for(const v of x)out.push(...flatResults(v,parent));return out}if(!x||typeof x!=='object')return[];const inherited={...parent};for(const k of ['playerId','player_id','spielerId','spieler_id','pass','passnummer','pass_number','player','spieler','playerName','player_name','spielerName','spieler_name','name'])if(x[k]!==undefined)inherited[k]=x[k];for(const k of ['results','result','ergebnisse','participations','teilnahmen','tournaments','turniere'])if(Array.isArray(x[k])){let out=[];for(const v of x[k])out.push(...flatResults(v,inherited));return out}return[{...inherited,...x}]}
function playerKeys(p){return [p.id,p.playerId,p.pass,p.passnummer,p.fullName,p.name].filter(v=>v!==undefined&&v!==null&&String(v).trim()).map(v=>norm(v))}
function resultPlayerKeys(r){let a=[];for(const k of ['playerId','player_id','spielerId','spieler_id','pass','passnummer','pass_number','player','spieler','playerName','player_name','spielerName','spieler_name','name']){const v=r[k];if(v&&typeof v==='object')a.push(v.id,v.playerId,v.pass,v.name,v.fullName);else if(v!==undefined&&v!==null)a.push(v)}return a.filter(v=>v!==undefined&&v!==null&&String(v).trim()).map(v=>norm(v))}
function resultTournament(r){let code=val(r,['code','tournamentCode','tournament_code','turnierCode','turnier_code','tournamentId','tournament_id']);let raw=val(r,['tournament','turnier','tournamentName','tournament_name','turnierName','turnier_name']);if(raw&&typeof raw==='object')raw=val(raw,['name','title','code','id']);if(!raw)raw=code||'Unbekanntes Turnier';return{code:String(code||raw),name:String(raw),date:val(r,['date','datum','startDate','start_date']),place:val(r,['place','platz','rank','position']),value:val(r,['value','result','ergebnis','total','score','punkte','points']),rounds:val(r,['rounds','runden','scores','roundScores'])}}
function mergeResults(raw){const by=new Map();players.forEach((p,i)=>playerKeys(p).forEach(k=>by.set(k,i)));const rows=flatResults(raw);resultRows+=rows.length;for(const r of rows){let i=-1;for(const k of resultPlayerKeys(r)){if(by.has(k)){i=by.get(k);break}}if(i<0){unmatchedResults++;continue}const t=resultTournament(r),p=players[i];p.tournaments=p.tournaments||[];const sig=[t.code,t.date,t.place,t.value].map(norm).join('|');if(!p.tournaments.some(x=>[x.code,x.date,x.place,x.value??x.total].map(norm).join('|')===sig)){p.tournaments.push(t);matchedResults++}}}
function build(){const cm=new Map(),lm=new Set(),tm=new Map();players.forEach((p,i)=>{const c=String(p.club||'').trim();if(c){const k=clubNorm(c);let x=cm.get(k);if(!x)x={name:c,players:[],lvs:new Set};if(!x.players.includes(i))x.players.push(i);if(c.length<x.name.length)x.name=c;if(p.lv)x.lvs.add(String(p.lv));cm.set(k,x)}if(p.lv)lm.add(String(p.lv));for(const t of p.tournaments||[]){const code=String(t.code||'').trim(),name=String(t.name||'').trim(),src=code||name;if(!src)continue;const m=src.match(/^(\d{4})[ ._:-]*(.*)$/),year=m?m[1]:'',title=(name||m?.[2]||src).replace(/^[-–—:|]+\s*/,'').trim(),key=year+'|'+norm(title);let x=tm.get(key);if(!x)x={id:key,name:title||src,year,codes:[],players:new Set,records:[]};if(code&&!x.codes.includes(code))x.codes.push(code);x.players.add(i);x.records.push({i,t});tm.set(key,x)}});clubs=[...cm.values()].map(x=>({...x,lvs:[...x.lvs]})).sort((a,b)=>a.name.localeCompare(b.name,'de'));lvs=uniq([...lm]);tournaments=[...tm.values()].map(x=>({...x,players:x.players.size})).sort((a,b)=>(b.year+b.name).localeCompare(a.year+a.name,'de'))}
function years(){return uniq(players.flatMap(p=>(p.history||[]).map(h=>String(h.date||'').slice(0,4)).filter(Boolean))).sort().reverse()}
function filters(){const f1=$('f1'),f2=$('f2');if(mode==='players'){f1.style.display=f2.style.display='';f1.innerHTML='<option value="">Alle Vereine</option>'+clubs.map(c=>`<option>${esc(c.name)}</option>`).join('');f2.innerHTML='<option value="">Alle Jahre</option>'+years().map(y=>`<option>${y}</option>`).join('')}else if(mode==='tournaments'){f1.style.display='';f2.style.display='none';f1.innerHTML='<option value="">Alle Jahre</option>'+years().map(y=>`<option>${y}</option>`).join('')}else if(mode==='clubs'){f1.style.display='';f2.style.display='none';f1.innerHTML='<option value="">Alle Verbände</option>'+lvs.map(x=>`<option>${esc(x)}</option>`).join('')}else{f1.style.display=f2.style.display='none'}}
function render(){const term=norm($('q').value),f1=$('f1').value,fy=$('f2').value;let a=[];if(mode==='players'){a=players.map((p,i)=>({p,i})).filter(x=>(!term||norm([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(term))&&(!f1||clubNorm(x.p.club)===clubNorm(f1))&&(!fy||(x.p.history||[]).some(h=>String(h.date||'').slice(0,4)===fy)));$('thead').innerHTML='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Pass</th><th>Turniere</th><th>DRL</th><th>Wert</th></tr>';$('rows').innerHTML=a.slice(0,1000).map(x=>`<tr><td><button class="linkbtn" data-player="${x.i}">${esc(x.p.name)}</button></td><td>${esc(x.p.club)}</td><td>${esc(x.p.lv)}</td><td>${esc(x.p.pass)}</td><td>${(x.p.tournaments||[]).length}</td><td>${esc(x.p.rank??'')}</td><td>${esc(x.p.value??'')}</td></tr>`).join('')}else if(mode==='clubs'){a=clubs.filter(c=>(!term||norm(c.name+' '+c.lvs.join(' ')).includes(term))&&(!f1||c.lvs.some(v=>norm(v)===norm(f1))));$('thead').innerHTML='<tr><th>Verein</th><th>Verbände</th><th>Spieler</th></tr>';$('rows').innerHTML=a.map(c=>`<tr><td><button class="linkbtn" data-club="${encodeURIComponent(c.name)}">${esc(c.name)}</button></td><td>${esc(c.lvs.join(', '))}</td><td>${c.players.length}</td></tr>`).join('')}else if(mode==='lvs'){a=lvs.filter(x=>!term||norm(x).includes(term));$('thead').innerHTML='<tr><th>Verband</th><th>Vereine</th><th>Spieler</th></tr>';$('rows').innerHTML=a.map(x=>`<tr><td><button class="linkbtn" data-lv="${encodeURIComponent(x)}">${esc(x)}</button></td><td>${clubs.filter(c=>c.lvs.some(v=>norm(v)===norm(x))).length}</td><td>${players.filter(p=>norm(p.lv)===norm(x)).length}</td></tr>`).join('')}else if(mode==='tournaments'){a=tournaments.filter(t=>(!term||norm(t.name+' '+t.year).includes(term))&&(!f1||t.year===f1));$('thead').innerHTML='<tr><th>Turnier</th><th>Jahr</th><th>Spieler</th><th>Codes</th></tr>';$('rows').innerHTML=a.map(t=>`<tr><td><button class="linkbtn" data-tournament="${encodeURIComponent(t.id)}">${esc(t.name)}</button></td><td>${esc(t.year)}</td><td>${t.players}</td><td>${t.codes.length}</td></tr>`).join('')}else if(mode==='global'){globalSearch();return}else if(mode==='dashboard'){dashboard();return}$('count').textContent=a.length.toLocaleString('de-DE');$('total').textContent=(mode==='players'?players.length:mode==='clubs'?clubs.length:mode==='lvs'?lvs.length:tournaments.length).toLocaleString('de-DE')}
function globalSearch(){const t=norm($('q').value);if(!t){$('thead').innerHTML='';$('rows').innerHTML='<tr><td>Suchbegriff eingeben.</td></tr>';return}const ps=players.map((p,i)=>({p,i})).filter(x=>norm([x.p.name,x.p.pass,x.p.club,x.p.lv].join(' ')).includes(t)).slice(0,100),cs=clubs.filter(c=>norm(c.name+' '+c.lvs.join(' ')).includes(t)).slice(0,100),ls=lvs.filter(x=>norm(x).includes(t)).slice(0,100),ts=tournaments.filter(x=>norm(x.name+' '+x.year).includes(t)).slice(0,100);$('thead').innerHTML='<tr><th>Typ</th><th>Treffer</th><th>Info</th></tr>';$('rows').innerHTML=ps.map(x=>`<tr><td>Spieler</td><td><button class="linkbtn" data-player="${x.i}">${esc(x.p.name)}</button></td><td>${esc(x.p.club)} · ${(x.p.tournaments||[]).length} Turniere</td></tr>`).join('')+cs.map(x=>`<tr><td>Verein</td><td><button class="linkbtn" data-club="${encodeURIComponent(x.name)}">${esc(x.name)}</button></td><td>${x.players.length} Spieler</td></tr>`).join('')+ls.map(x=>`<tr><td>Verband</td><td><button class="linkbtn" data-lv="${encodeURIComponent(x)}">${esc(x)}</button></td><td></td></tr>`).join('')+ts.map(x=>`<tr><td>Turnier</td><td><button class="linkbtn" data-tournament="${encodeURIComponent(x.id)}">${esc(x.name)}</button></td><td>${x.year} · ${x.players} Spieler</td></tr>`).join('');$('count').textContent=ps.length+cs.length+ls.length+ts.length;$('total').textContent='' }
function showPlayer(i){const p=players[i];if(!p)return;const ts=(p.tournaments||[]).slice().sort((a,b)=>String(b.date||b.code||'').localeCompare(String(a.date||a.code||'')));$('profile').style.display='block';$('profile').innerHTML=`<h2>👤 ${esc(p.name)}</h2><div class="grid"><div class="card"><b>Pass</b><br>${esc(p.pass||'–')}</div><div class="card"><b>Verein</b><br><button class="linkbtn" data-club="${encodeURIComponent(p.club||'')}">${esc(p.club||'–')}</button></div><div class="card"><b>Verband</b><br>${esc(p.lv||'–')}</div><div class="card"><b>Turnier-/Ergebnisdaten</b><br>${ts.length}</div><div class="card"><b>DRL-Platz</b><br>${esc(p.rank??'–')}</div></div><div class="sort"><button data-close>✕ Profil schließen</button></div><h3>🏆 Turniere & Ergebnisse</h3><div class="hist">${ts.map(t=>{const code=String(t.code||''),g=tournaments.find(x=>x.codes.includes(code)),title=t.name||g?.name||code||'Turnier';return `<div class="round"><b>${esc(title)}</b>${g?.year?' · '+esc(g.year):''}<br><span class="small">${esc(t.date||'')} · Platz ${esc(t.place??'–')} · Ergebnis ${esc(t.value??t.total??t.result??'–')}</span>${t.rounds?`<br><span class="small">Runden: ${esc(Array.isArray(t.rounds)?t.rounds.join(' · '):t.rounds)}</span>`:''}</div>`}).join('')||'<div class="hint">Keine Turnier-/Ergebnisdaten vorhanden.</div>'}</div>`;$('profile').scrollIntoView({behavior:'smooth',block:'start'})}
function showClub(name){const c=clubs.find(x=>clubNorm(x.name)===clubNorm(name));if(!c)return;$('profile').style.display='block';$('profile').innerHTML=`<h2>🏟️ ${esc(c.name)}</h2><div class="grid"><div class="card"><b>Spieler</b><br>${c.players.length}</div><div class="card"><b>Verbände</b><br>${esc(c.lvs.join(', ')||'–')}</div></div><h3>Spieler</h3><div class="hist">${c.players.map(i=>`<div class="round"><button class="linkbtn" data-player="${i}">${esc(players[i].name)}</button> · ${esc(players[i].lv||'–')} · Pass ${esc(players[i].pass||'–')} · ${(players[i].tournaments||[]).length} Turniere</div>`).join('')}</div>`}
function showLv(lv){const cs=clubs.filter(c=>c.lvs.some(v=>norm(v)===norm(lv))),ps=players.map((p,i)=>({p,i})).filter(x=>norm(x.p.lv)===norm(lv));$('profile').style.display='block';$('profile').innerHTML=`<h2>🌐 ${esc(lv)}</h2><div class="grid"><div class="card"><b>Vereine</b><br>${cs.length}</div><div class="card"><b>Spieler</b><br>${ps.length}</div></div><h3>Vereine</h3><div class="hist">${cs.map(c=>`<div class="round"><button class="linkbtn" data-club="${encodeURIComponent(c.name)}">${esc(c.name)}</button> · ${c.players.length} Spieler</div>`).join('')}</div>`}
function showTournament(id){const t=tournaments.find(x=>x.id===id);if(!t)return;$('profile').style.display='block';$('profile').innerHTML=`<h2>🏆 ${esc(t.name)} ${esc(t.year)}</h2><div class="grid"><div class="card"><b>Spieler</b><br>${t.players}</div><div class="card"><b>Codes</b><br>${t.codes.length}</div></div><div class="sort"><button data-close>✕ schließen</button></div><h3>Ergebnisse</h3><div class="table"><table><thead><tr><th>Spieler</th><th>Verein</th><th>Platz</th><th>Ergebnis</th><th>Datum</th></tr></thead><tbody>${t.records.map(r=>{const p=players[r.i],x=r.t;return `<tr><td><button class="linkbtn" data-player="${r.i}">${esc(p.name)}</button></td><td>${esc(p.club)}</td><td>${esc(x.place??'–')}</td><td>${esc(x.value??x.total??x.result??'–')}</td><td>${esc(x.date||'')}</td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const total=players.reduce((n,p)=>n+(p.tournaments||[]).length,0);$('thead').innerHTML='';$('rows').innerHTML=`<tr><td><div class="grid"><div class="card"><b>Spieler</b><br>${players.length.toLocaleString('de-DE')}</div><div class="card"><b>Turnier-/Ergebnisdatensätze</b><br>${total.toLocaleString('de-DE')}</div><div class="card"><b>Spieler mit Turnieren</b><br>${players.filter(p=>(p.tournaments||[]).length).length.toLocaleString('de-DE')}</div><div class="card"><b>Zusammengeführte Turniere</b><br>${tournaments.length.toLocaleString('de-DE')}</div><div class="card"><b>Ergebnisdateien geladen</b><br>${loadedResultFiles}/8</div><div class="card"><b>Roh-Ergebniszeilen</b><br>${resultRows.toLocaleString('de-DE')}</div></div></td></tr>`;$('count').textContent='';$('total').textContent='' }
function quality(){const pass=new Map;players.forEach((p,i)=>{if(p.pass){const k=String(p.pass);if(!pass.has(k))pass.set(k,[]);pass.get(k).push(i)}});const dup=[...pass.values()].filter(a=>a.length>1);$('profile').style.display='block';$('profile').innerHTML=`<h2>🧪 Datenprüfung</h2><div class="grid"><div class="card"><b>Spieler</b><br>${players.length}</div><div class="card"><b>Ergebniszeilen</b><br>${resultRows}</div><div class="card"><b>Zuordnungen</b><br>${matchedResults}</div><div class="card"><b>Nicht zugeordnet</b><br>${unmatchedResults}</div><div class="card"><b>Doppelte Pässe</b><br>${dup.length}</div></div>`}
function setMode(m){mode=m;$('tabs').querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('profile').style.display='none';$('q').value='';filters();render()}
$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setMode(b.dataset.mode);if(e.target.id==='quality')quality()});$('q').addEventListener('input',render);$('f1').addEventListener('change',render);$('f2').addEventListener('change',render);document.addEventListener('click',e=>{const b=e.target.closest('[data-player],[data-club],[data-lv],[data-tournament],[data-close]');if(!b)return;if(b.dataset.player!==undefined)showPlayer(Number(b.dataset.player));else if(b.dataset.club!==undefined)showClub(decodeURIComponent(b.dataset.club));else if(b.dataset.lv!==undefined)showLv(decodeURIComponent(b.dataset.lv));else if(b.dataset.tournament!==undefined)showTournament(decodeURIComponent(b.dataset.tournament));else if(b.dataset.close)$('profile').style.display='none'});
async function load(){try{let loaded=[];for(const u of playerFiles){const r=await fetch(u+'?v='+Date.now());if(!r.ok)throw Error('Spielerdaten '+u+' HTTP '+r.status);loaded.push(await r.json())}players=loaded.flat();build();$('stand').textContent=`${players.length.toLocaleString('de-DE')} Spieler geladen · Ergebnisdaten werden nachgeladen …`;filters();render();for(let n=0;n<resultFiles.length;n++){try{const r=await fetch(resultFiles[n]+'?v='+Date.now());if(!r.ok)throw Error('HTTP '+r.status);mergeResults(await r.json());loadedResultFiles++;build();$('stand').textContent=`${players.length.toLocaleString('de-DE')} Spieler · ${resultRows.toLocaleString('de-DE')} Ergebnisse verarbeitet · ${loadedResultFiles}/8 Ergebnisdateien`;$('hint').innerHTML=`<span class="ok">✓ Daten werden fortlaufend geladen.</span> ${matchedResults.toLocaleString('de-DE')} Ergebnisse Spielern zugeordnet${unmatchedResults?' · '+unmatchedResults.toLocaleString('de-DE')+' noch nicht eindeutig zugeordnet':''}.`;render()}catch(err){$('hint').innerHTML+=`<br><span class="warn">Ergebnisdatei ${n+1} konnte nicht geladen werden: ${esc(err.message)}</span>`}}$('stand').textContent+=` · fertig`;render()}catch(e){$('stand').textContent='Fehler beim Laden der Spielerdaten: '+e.message;$('hint').innerHTML='<span class="warn">Die Spielerstammdaten konnten nicht geladen werden.</span>'}}
load();
</script></body></html>
