th.max(1,Math.ceil(a.length/SZ))} <button onclick="if(pg){pg--;draw()}">‹</button> <button onclick="if((pg+1)*SZ<a.length){pg++;draw()}">›</button>`}function prof(i){let p=P[i],r=(p._r||[]).slice().sort((a,b)=>String(b.year).localeCompare(String(a.year)));$('prof').style.display='block';$('prof').innerHTML=`<h2>👤 ${E(p.name)}</h2><p><b>Verein:</b> ${E(p.club)} · <b>LV:</b> ${E(p.lv)} · <b>Pass:</b> ${E(p.pass)}</p><h3>🏆 Turniere & Ergebnisse (${r.length})</h3><div class="t"><table><tr><th>Jahr</th><th>Datum</th><th>Turnier</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>${r.map(x=>`<tr><td>${E(x.year)}</td><td>${E(x.date)}</td><td>${E(x.name)}</td><td>${E(x.rank)}</td><td>${E((x.rounds||[]).join(', '))}</td><td>${E(x.total)}</td></tr>`).join('')}</table></div><h3>📈 Deutsche Rangliste</h3><p>Die vollständigen DRL-Stichtagslisten 2015–2025 sind über das offizielle DMV-Archiv abrufbar.</p><a target="_blank" href="https://www.minigolfsport.de/sportbetrieb.php?s=11&subpage=18&t=Archivdaten">DRL-Archiv öffnen</a>`;$('prof').scrollIntoView({behavior:'smooth'})}$('tabs').onclick=e=>{let b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;pg=0;$('q').value='';$('prof').style.display='none';document.querySelectorAll('[data-m]').forEach(x=>x.classList.toggle('a',x===b));draw()};$('q').oninput=()=>{pg=0;draw()};$('y').onchange=()=>{pg=0;draw()};document.addEventListener('click',e=>{let b=e.target.closest('[data-p],[data-c],[data-l],[data-t]');if(!b)return;if(b.dataset.p!=null)prof(+b.dataset.p);else if(b.dataset.c!=null){let c=decodeURIComponent(b.dataset.c);$('q').value=c;mode='p';draw()}else if(b.dataset.l!=null){let l=decodeURIComponent(b.dataset.l);$('q').value=l;mode='p';draw()}else if(b.dataset.t!=null){let t=decodeURIComponent(b.dataset.t),x=tours().find(a=>a.k===t);if(x){$('prof').style.display='block';$('prof').innerHTML='<h2>🏆 '+E(x.name)+'</h2><p>'+E(x.year)+' · '+E(x.place)+' · '+x.ps.size+' Teilnehmer · '+x.rows.length+' Ergebniszeilen</p><div class="
