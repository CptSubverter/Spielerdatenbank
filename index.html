<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bahnengolf Spielerdatenbank</title><style>body{font:14px Arial;margin:0;background:#3d3d3d;color:#123}.w{max-width:1700px;margin:auto;padding:12px}.h{background:#2fa7fa;color:#fff;padding:18px;border-radius:12px}.h h1{margin:0 0 6px}nav{display:flex;gap:5px;flex-wrap:wrap;margin:10px 0}button{padding:9px 12px;border:0;border-radius:7px;cursor:pointer}.lnk{background:none;color:#0781c9;font-weight:bold;padding:0}.bar{display:flex;gap:5px;flex-wrap:wrap}input,select{padding:9px}main{background:#f5f9fc;padding:12px;border-radius:10px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:8px;margin:10px 0}.stat,.panel{background:#fff;padding:12px;border-radius:10px}.stat b{display:block;font-size:19px;color:#1687d9}table{width:100%;border-collapse:collapse;background:#fff}th{background:#2fa7fa;color:#fff;padding:7px;text-align:left;position:sticky;top:0}td{padding:6px;border-bottom:1px solid #ddd}.scroll{max-height:72vh;overflow:auto}.chips button{margin:3px;background:#eef7fd}.muted{color:#667}.badge{background:#eef7fd;padding:5px 9px;border-radius:15px;margin-left:5px}</style></head><body><div class="w"><header class="h"><h1>🏆 Bahnengolf Spielerdatenbank</h1><div id="s">Lade geprüfte Spielerdaten …</div></header><nav id="n"><button data-m="p">👤 Spieler</button><button data-m="c">🏟️ Vereine</button><button data-m="a">🌐 Verbände</button><button data-m="t">🏆 Turniere</button><button data-m="r">📊 Ergebnisse</button><button data-m="d">📈 DRL</button><button data-m="m">📋 DMV-Liste</button></nav><main><div class="bar"><input id="q" placeholder="Alle Daten durchsuchen …"><select id="y"><option value="">Alle Jahre</option></select></div><div id="stats" class="stats"></div><div id="o"></div></main></div><script>
const $=x=>document.getElementById(x),N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss').replace(/[^a-z0-9]+/g,' ').trim(),E=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const get=async u=>{let r=await fetch(u+'?v=20260916');if(!r.ok)throw Error('HTTP '+r.status+' bei '+u);return r.json()};let P=[],T=[],mode='p',hist=[],clubs=new Map(),lvs=new Map(),tLoaded=false;
function club(x){return String(x??'').trim().replace(/\s+(?:I{1,3}|IV|V|[1-5])$/i,'').replace(/\s+e\.?\s*v\.?$/i,'').trim()}function btn(k,id,t){return '<button class="lnk" data-'+k+'="'+E(id)+'">'+E(t||'—')+'</button>'}function back(){let h=hist.pop();if(h){mode=h.mode;$('q').value=h.q;$('y').value=h.y;draw()}else draw()}
async function loadT(){if(tLoaded)return;$('s').textContent='Lade Turnier-Relationen …';T=await get('data/relations/tournaments.json');tLoaded=true;T.forEach(t=>{t.result_ids=t.result_ids||[];t.player_ids=t.player_ids||[]});let ys=[...new Set(T.map(t=>t.year).filter(Boolean))].sort().reverse();$('y').innerHTML='<option value="">Alle Jahre</option>'+ys.map(y=>'<option>'+E(y)+'</option>').join('')}
async function load(){try{P=await get('data/relations/players.json');P.forEach((p,i)=>{p._i=i;p.result_ids=p.result_ids||[];p.drl_ids=p.drl_ids||[];let c=club(p.club);if(c){let k=N(c);if(!clubs.has(k))clubs.set(k,{name:c,players:[]});clubs.get(k).players.push(i)}if(p.lv){let k=N(p.lv);if(!lvs.has(k))lvs.set(k,{name:p.lv,players:[]});lvs.get(k).players.push(i)}});$('stats').innerHTML='<div class="stat"><b>'+P.length.toLocaleString('de-DE')+'</b>Spieler</div><div class="stat"><b>'+clubs.size.toLocaleString('de-DE')+'</b>Vereine</div><div class="stat"><b>'+lvs.size.toLocaleString('de-DE')+'</b>Verbände/LV</div><div class="stat"><b>'+P.reduce((n,p)=>n+p.result_ids.length,0).toLocaleString('de-DE')+'</b>verknüpfte Ergebnisse</div><div class="stat"><b>'+P.reduce((n,p)=>n+p.drl_ids.length,0).toLocaleString('de-DE')+'</b>DRL-Verknüpfungen</div>';$('s').textContent='Daten geladen · geprüfte Spieler-Relationen';draw()}catch(e){console.error(e);$('s').textContent='Fehler: '+e.message;$('o').innerHTML='<div class="panel">Die Daten konnten nicht geladen werden.<br>'+E(e.message)+'</div>'}}
function draw(){let q=N($('q').value),a=P.map((p,i)=>({p,i})).filter(x=>!q||N([x.p.name,x.p.club,x.p.lv,x.p.pass].join(' ')).includes(q));if(mode==='p'||mode==='m'){let h='<tr><th>Spieler</th><th>Verein</th><th>LV</th><th>Pass</th><th>Ergebnisse</th><th>DRL</th></tr>',b=a.slice(0,1500).map(x=>'<tr><td>'+btn('p',x.i,x.p.name)+'</td><td>'+btn('c',N(club(x.p.club)),club(x.p.club))+'</td><td>'+btn('a',N(x.p.lv),x.p.lv)+'</td><td>'+E(x.p.pass)+'</td><td>'+x.p.result_ids.length+'</td><td>'+x.p.drl_ids.length+'</td></tr>').join('');$('o').innerHTML='<div class="panel"><div class="muted">Die geprüfte Relationsdatei wird direkt geladen. Große Ergebnisdateien werden nicht mehr beim Start geladen.</div><div class="scroll"><table><thead>'+h+'</thead><tbody>'+b+'</tbody></table></div></div>';return}if(mode==='c'){let a=[...clubs.values()].filter(c=>!q||N(c.name).includes(q));$('o').innerHTML='<div class="panel"><table><tr><th>Verein</th><th>Spieler</th></tr>'+a.map(c=>'<tr><td>'+btn('c',N(c.name),c.name)+'</td><td>'+c.players.length+'</td></tr>').join('')+'</table></div>';return}if(mode==='a'){let a=[...lvs.values()].filter(c=>!q||N(c.name).includes(q));$('o').innerHTML='<div class="panel"><table><tr><th>Verband/LV</th><th>Spieler</th></tr>'+a.map(c=>'<tr><td>'+btn('a',N(c.name),c.name)+'</td><td>'+c.players.length+'</td></tr>').join('')+'</table></div>';return}if(mode==='d'){location.href='drl.html';return}if(mode==='t'){loadT().then(()=>{let a=T.filter(t=>(!q||N([t.name,t.place,t.year].join(' ')).includes(q))&&(!$('y').value||t.year===$('y').value));$('o').innerHTML='<div class="panel"><table><tr><th>Turnier</th><th>Jahr</th><th>Ort</th><th>Spieler</th><th>Ergebnisse</th></tr>'+a.map(t=>'<tr><td>'+btn('t',t.id,t.name)+'</td><td>'+E(t.year)+'</td><td>'+E(t.place)+'</td><td>'+t.player_ids.length+'</td><td>'+t.result_ids.length+'</td></tr>').join('')+'</table></div>'}).catch(e=>$('o').innerHTML='<div class="panel">Fehler: '+E(e.message)+'</div>');return}if(mode==='r'){$('o').innerHTML='<div class="panel"><b>Ergebnisse werden bei Auswahl eines Spielers oder Turniers aus den Relationsdaten nachgeladen.</b></div>'}}
async function profile(i){let p=P[+i];if(!p)return;await loadT();hist.push({mode,q:$('q').value,y:$('y').value});let ids=new Set(p.result_ids),ts=T.filter(t=>t.player_ids.includes(p.id)||t.result_ids.some(id=>ids.has(id))).sort((a,b)=>String(b.year).localeCompare(String(a.year))||String(b.date).localeCompare(String(a.date)));$('o').innerHTML='<div class="panel"><button class="lnk" data-back="1">← Übersicht</button><h2>👤 '+E(p.name)+' <span class="badge">'+ts.length+' Turniere</span><span class="badge">'+p.result_ids.length+' Ergebnisse</span></h2><p><b>Verein:</b> '+btn('c',N(club(p.club)),club(p.club))+' · <b>LV:</b> '+btn('a',N(p.lv),p.lv)+' · <b>Pass:</b> '+E(p.pass)+'</p><h3>🏆 Alle Turnierteilnahmen</h3><div class="scroll"><table><tr><th>Jahr</th><th>Datum</th><th>Turnier</th><th>Ort</th><th>Ergebnisse</th></tr>'+ts.map(t=>'<tr><td>'+E(t.year)+'</td><td>'+E(t.date)+'</td><td>'+btn('t',t.id,t.name||'(Turniername nicht hinterlegt)')+'</td><td>'+E(t.place)+'</td><td>'+t.result_ids.filter(id=>ids.has(id)).length+'</td></tr>').join('')+'</table></div></div>'}
function detail(k,id){if(k==='p'){profile(id);return}hist.push({mode,q:$('q').value,y:$('y').value});if(k==='c'){let c=clubs.get(id);if(!c)return;$('o').innerHTML='<div class="panel"><button class="lnk" data-back="1">← Übersicht</button><h2>🏟️ '+E(c.name)+'</h2><div class="chips">'+c.players.map(i=>btn('p',i,P[i].name)).join(' ')+'</div></div>'}else if(k==='a'){let a=lvs.get(id);if(!a)return;$('o').innerHTML='<div class="panel"><button class="lnk" data-back="1">← Übersicht</button><h2>🌐 '+E(a.name)+'</h2><div class="chips">'+a.players.map(i=>btn('p',i,P[i].name)).join(' ')+'</div></div>'}else if(k==='t'){let t=T.find(x=>x.id===id);if(!t)return;$('o').innerHTML='<div class="panel"><button class="lnk" data-back="1">← Übersicht</button><h2>🏆 '+E(t.name||'(Turniername nicht hinterlegt)')+'</h2><p>'+E(t.year)+' · '+E(t.date)+' · '+E(t.place)+'</p><p>'+t.player_ids.length+' Spieler · '+t.result_ids.length+' Ergebniszeilen</p><div class="chips">'+t.player_ids.map(pid=>{let i=P.findIndex(p=>p.id===pid);return i>=0?btn('p',i,P[i].name):''}).join(' ')+'</div></div>'}}
$('n').onclick=e=>{let b=e.target.closest('[data-m]');if(b){hist=[];mode=b.dataset.m;draw()}};$('q').oninput=draw;$('y').onchange=draw;document.addEventListener('click',e=>{let b=e.target.closest('[data-p],[data-c],[data-a],[data-t],[data-back]');if(!b)return;if(b.dataset.back)return back();if(b.dataset.p!=null)detail('p',b.dataset.p);else if(b.dataset.c!=null)detail('c',b.dataset.c);else if(b.dataset.a!=null)detail('a',b.dataset.a);else if(b.dataset.t!=null)detail('t',b.dataset.t)});load();</script></body></html>
