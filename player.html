<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spielerdatensatz</title><style>body{margin:0;background:#3d3d3d;font:14px Arial;color:#173042}.w{max-width:1500px;margin:auto;padding:14px}.h{background:#2fa7fa;color:#fff;padding:18px;border-radius:14px}.panel{background:#fff;padding:14px;border-radius:10px;margin-top:12px}table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#2fa7fa;color:#fff;text-align:left;padding:8px}td{padding:7px;border-bottom:1px solid #ddd}.lnk{color:#0781c9;font-weight:bold}.muted{color:#667}</style></head><body><div class="w"><div class="h"><h1>👤 Spieler</h1><div>Verknüpfter Datensatz aus Spielerdatenbank, Ergebnissen und DRL</div></div><div id="o" class="panel">Lade …</div></div><script>const E=x=>String(x??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));const N=x=>String(x??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ß/g,'ss');let P=[],R=[];async function load(){let pass=new URLSearchParams(location.search).get('pass')||'';try{for(let i=1;i<=8;i++){let x=await fetch('data/players-'+String(i).padStart(2,'0')+'.json?x=2').then(r=>r.json());P.push(...(Array.isArray(x)?x:x.players||[]))}let p=P.find(x=>String(x.pass||x.passnummer||'')===pass);if(!p){p=P.find(x=>N(x.name||x.fullName||'').includes(N(pass)))}if(!p){$('o').innerHTML='<h2>Spieler nicht gefunden</h2><p>Pass: '+E(pass)+'</p>';return}for(let i=1;i<=8;i++){let x=await fetch('data/results-'+String(i).padStart(2,'0')+'.json?x=2').then(r=>r.json());R.push(...(Array.isArray(x)?x:(x.results||x.ergebnisse||x.participations||x.teilnahmen||x.data||[])))}let keys=[p.id,p.playerId,p.player_id,p.pass,p.passnummer,p.name,p.fullName].filter(Boolean).map(N);let rs=R.filter(z=>{let vals=['playerId','player_id','spielerId','spieler_id','pass','passnummer','playerName','player_name','spielerName','spieler_name','name','fullName'].flatMap(k=>{let v=z?.[k];return v&&typeof v==='object'?[v.id,v.playerId,v.pass,v.name]:[v]}).filter(Boolean).map(N);return vals.some(v=>keys.includes(v))});$('o').innerHTML='<h2>'+E(p.name||p.fullName||'')+'</h2><p><b>Pass:</b> '+E(p.pass||p.passnummer||'')+' · <b>Verein:</b> '+E(p.club||'')+' · <b>LV:</b> '+E(p.lv||'')+'</p><p>'+rs.length+' verknüpfte Ergebnisdatensätze</p><table><tr><th>Jahr</th><th>Turnier</th><th>Ort</th><th>Platz</th><th>Runden</th><th>Gesamt</th></tr>'+rs.map(z=>'<tr><td>'+E(z.year||z.jahr||'')+'</td><td>'+E(z.tournamentName||z.tournament_name||z.turnierName||z.turnier_name||z.tournament||z.turnier||z.eventName||'')+'</td><td>'+E(z.place||z.ort||z.location||'')+'</td><td>'+E(z.rank||z.platz||z.position||'')+'</td><td>'+E((z.rounds||z.runden||z.scores||[]).join(', '))+'</td><td>'+E(z.total||z.result||z.ergebnis||z.score||z.value||'')+'</td></tr>').join('')+'</table><p><a class="lnk" href="drl.html?q='+encodeURIComponent(p.name||'')+'">📈 DRL dieses Spielers suchen</a> · <a class="lnk" href="index.html">🏠 Zur Spielerdatenbank</a></p>'}catch(e){$('o').innerHTML='<h2>Fehler</h2><p>'+E(e.message)+'</p>'}}function $(x){return document.getElementById(x)}load();</script></body></html>
