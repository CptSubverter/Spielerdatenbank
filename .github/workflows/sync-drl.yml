name: DRL Datenabgleich
on:
  push:
    paths:
      - '.github/workflows/sync-drl.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Abhängigkeiten installieren
        run: pip install requests pandas xlrd openpyxl beautifulsoup4
      - name: Vollständiges DMV-DRL-Archiv abrufen
        run: |
          python - <<'PY'
          import os,json,requests,pandas as pd
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          base='https://www.minigolfsport.de/'
          archive=base+'sportbetrieb.php?s=11&subpage=18&t=Archivdaten'
          html=requests.get(archive,timeout=60).text
          soup=BeautifulSoup(html,'html.parser')
          links=[]
          for a in soup.find_all('a',href=True):
            h=a['href']; u=urljoin(base,h)
            if h.lower().endswith(('.xls','.xlsx')) and u not in links: links.append(u)
          os.makedirs('tmp/drl',exist_ok=True); rows=[]
          for idx,u in enumerate(links,1):
            try:
              fn='tmp/drl/'+u.rsplit('/',1)[-1]
              b=requests.get(u,timeout=60).content; open(fn,'wb').write(b)
              df=pd.read_excel(fn,dtype=str)
              df.columns=[str(c).strip() for c in df.columns]
              for _,r in df.iterrows():
                d={str(k):('' if pd.isna(v) else str(v)) for k,v in r.items()}; d['_source']=u; rows.append(d)
              print(idx,'OK',u,len(df))
            except Exception as e: print(idx,'SKIP',u,e)
          out='data/drl'; os.makedirs(out,exist_ok=True)
          for f in os.listdir(out): os.remove(os.path.join(out,f))
          chunk=5000
          for i in range(0,len(rows),chunk):
            with open(f'{out}/drl-{i//chunk+1:02d}.json','w',encoding='utf-8') as f: json.dump(rows[i:i+chunk],f,ensure_ascii=False,separators=(',',':'))
          json.dump({'source':'DMV Deutsche Rangliste Archiv','source_page':archive,'source_files':len(links),'records':len(rows),'files':(len(rows)+chunk-1)//chunk},open(out+'/manifest.json','w',encoding='utf8'),ensure_ascii=False,indent=2)
          PY
      - name: Änderungen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/drl
          git diff --cached --quiet || git commit -m 'DRL-Archiv automatisch aktualisieren'
          git push
