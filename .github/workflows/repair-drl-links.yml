name: DRL-Verknüpfungen reparieren
on:
  push:
    paths:
      - '.github/workflows/repair-drl-links.yml'
      - 'scripts/repair-drl-links.py'
  workflow_run:
    workflows: ["Relationen aufbauen"]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: DRL-Verknüpfungen reparieren
        run: python scripts/repair-drl-links.py
      - name: Reparierte Relationen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/relations
          git diff --cached --quiet || git commit -m 'DRL-Verknüpfungen automatisch reparieren'
          git push
