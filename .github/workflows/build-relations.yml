name: Relationen aufbauen
on:
  push:
    paths:
      - 'data/players-*.json'
      - 'data/results-*.json'
      - 'data/drl/*.json'
      - 'data/jlp-2025.json'
      - 'scripts/build-relations.py'
      - 'scripts/audit-relations.py'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Relationen erzeugen
        run: python scripts/build-relations.py
      - name: Vollständige Relationsprüfung
        run: python scripts/audit-relations.py
      - name: Relationen veröffentlichen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/relations
          git diff --cached --quiet || git commit -m 'Relationen automatisch aktualisieren'
          git push
